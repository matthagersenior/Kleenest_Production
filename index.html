<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#173d2b" />
    <meta name="description" content="Kleenest helps you find a nearby restroom and get moving quickly." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/Kleenest_Production/manifest.webmanifest" />
    <title>Kleenest</title>
    <script>
      (function () {
        try {
          var route = window.sessionStorage.getItem('kleenest:pages-route');
          if (route) {
            window.sessionStorage.removeItem('kleenest:pages-route');
            var base = '/Kleenest_Production';
            window.history.replaceState(null, '', base + (route.charAt(0) === '/' ? route : '/' + route));
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
