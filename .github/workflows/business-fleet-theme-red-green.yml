name: Business Fleet Theme Red Green

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  theme-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Business and Fleet theme coverage
        run: node scripts/business-fleet-theme-coverage-audit.mjs
