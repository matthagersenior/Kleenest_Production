name: Verify Kleenest Installation Center

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Consumer Standalone Installer"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: kleenest-install-center-smoke
  cancel-in-progress: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download deployed release state
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: Kleenest-deployed-release-state
          path: deployed-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve deployed source SHA
        id: deployed
        if: github.event_name == 'workflow_run'
        run: |
          SOURCE_SHA="$(node -e "const fs=require('fs');const state=JSON.parse(fs.readFileSync('deployed-release/Kleenest-release-state.json','utf8'));process.stdout.write(String(state.currentSha||''))")"
          test -n "$SOURCE_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployed.outputs.source_sha || github.sha }}
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Click through live Installation Center
        run: npx playwright test scripts/install-center-browser-smoke.spec.ts --reporter=line --workers=1
