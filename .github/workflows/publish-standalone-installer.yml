name: Publish Consumer Standalone Installer

on:
  workflow_run:
    workflows: ["Validate Kleenest Consumer Web Preview"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kleenest-consumer-preview-pages
  cancel-in-progress: ${{ github.event.workflow_run.conclusion == 'success' }}

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: node scripts/pages-deployment-convergence-audit.mjs
      - name: Export current Consumer web app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: npm run web:export --workspace @kleenest/consumer-mobile
      - name: Export Kleenest Business Web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: npm run web:export --workspace @kleenest/business-mobile
      - name: Verify Kleenest Business Web
        run: |
          test -s apps/business-mobile/dist/index.html
          grep -q "Kleenest Business" apps/business-mobile/dist/index.html
      - name: Export KleenestOS Web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: npm run web:export --workspace @kleenest/owner-mobile
      - name: Verify KleenestOS Web
        run: |
          test -s apps/platform-mobile/dist/index.html
          grep -q "KleenestOS" apps/platform-mobile/dist/index.html
      - name: Prepare installable Consumer Web PWA
        run: |
          node scripts/prepare-consumer-web-pwa.mjs
          test -s apps/consumer-mobile/dist/manifest.webmanifest
          test -s apps/consumer-mobile/dist/sw.js
          test -s apps/consumer-mobile/dist/app-icon.png
          test -s apps/consumer-mobile/dist/app-icon-512.svg
      - name: Resolve freshest verified Consumer APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/resolve-consumer-apk-baseline.mjs --target-sha "$TARGET_SHA"
      - name: Fetch Consumer APK baseline commit
        run: git fetch --no-tags --depth=1 origin "${{ steps.apk.outputs.source_sha }}"
      - name: Assess Consumer native and OTA drift
        run: node scripts/consumer-release-drift-audit.mjs --baseline "${{ steps.apk.outputs.source_sha }}" --report-only --json-out "$RUNNER_TEMP/Kleenest-release-state.json"
      - name: Download freshest verified Consumer APK
        uses: actions/download-artifact@v4
        with:
          name: Kleenest-Consumer-Standalone-APK
          path: installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.apk.outputs.run_id }}
      - name: Publish direct installer and legal resources alongside web app
        run: |
          set -euo pipefail
          test -s installer/Kleenest-Consumer.apk
          cp installer/Kleenest-Consumer.apk apps/consumer-mobile/dist/Kleenest-Consumer.apk
          cp "$RUNNER_TEMP/Kleenest-release-state.json" apps/consumer-mobile/dist/Kleenest-release-state.json
          mkdir -p apps/consumer-mobile/dist/legal
          cp public/legal/*.html apps/consumer-mobile/dist/legal/
          rm -rf apps/consumer-mobile/dist/developer apps/consumer-mobile/dist/owner apps/consumer-mobile/dist/business
          mkdir -p apps/consumer-mobile/dist/developer apps/consumer-mobile/dist/owner apps/consumer-mobile/dist/business
          cp -R apps/developer-portal/static/. apps/consumer-mobile/dist/developer/
          cp -R apps/platform-mobile/dist/. apps/consumer-mobile/dist/owner/
          cp -R apps/business-mobile/dist/. apps/consumer-mobile/dist/business/
          owner_routes="auth control pilots developers operations businesses moderation access accounts history intelligence reports progression capabilities audit data notifications support terms privacy account"
          for route in $owner_routes; do
            mkdir -p "apps/consumer-mobile/dist/owner/$route"
            cp apps/platform-mobile/dist/index.html "apps/consumer-mobile/dist/owner/$route/index.html"
          done
          business_routes="auth tools locations engagement operations analytics workspaces onboarding demo profile members assistant reviews qr-studio qr-designer live-network progression intelligence capabilities growth prevention trust-operations governance enterprise-economy enterprise-locations enterprise-location-admin enterprise partners notifications support terms privacy account"
          for route in $business_routes; do
            mkdir -p "apps/consumer-mobile/dist/business/$route"
            cp apps/business-mobile/dist/index.html "apps/consumer-mobile/dist/business/$route/index.html"
          done
          for legal in privacy account-deletion terms community-guidelines; do
            test -s "apps/consumer-mobile/dist/legal/${legal}.html"
          done
          test -s apps/consumer-mobile/dist/developer/index.html
          test -s apps/consumer-mobile/dist/developer/manifest.webmanifest
          test -s apps/consumer-mobile/dist/developer/sw.js
          test -s apps/consumer-mobile/dist/owner/index.html
          test -s apps/consumer-mobile/dist/owner/control/index.html
          test -s apps/consumer-mobile/dist/owner/auth/index.html
          test -s apps/consumer-mobile/dist/business/index.html
          test -s apps/consumer-mobile/dist/business/tools/index.html
          test -s apps/consumer-mobile/dist/business/analytics/index.html
          test -s apps/consumer-mobile/dist/business/enterprise-location-admin/index.html
          test -s apps/consumer-mobile/dist/Kleenest-release-state.json
          grep -q "Kleenest Developer Portal" apps/consumer-mobile/dist/developer/index.html
          grep -q "Browser token" apps/consumer-mobile/dist/developer/index.html
          public_routes="install for-you for-business trust"
          for route in $public_routes; do
            mkdir -p "apps/consumer-mobile/dist/$route"
            cp apps/consumer-mobile/dist/index.html "apps/consumer-mobile/dist/$route/index.html"
            test -s "apps/consumer-mobile/dist/$route/index.html"
          done
          cp apps/consumer-mobile/dist/index.html apps/consumer-mobile/dist/404.html
          touch apps/consumer-mobile/dist/.nojekyll
          sha256sum apps/consumer-mobile/dist/Kleenest-Consumer.apk > apps/consumer-mobile/dist/Kleenest-Consumer.apk.sha256
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/consumer-mobile/dist
      - name: Deploy Consumer web app, Business Web, KleenestOS Web, Developer Portal, legal resources, and direct APK
        id: deployment
        uses: actions/deploy-pages@v4
