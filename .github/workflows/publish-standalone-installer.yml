name: Publish Consumer Standalone Installer

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact validated main SHA to publish
        required: false
        type: string
  workflow_run:
    workflows: ["Validate Kleenest Consumer Web Preview"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kleenest-consumer-preview-pages-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve GitHub Pages deployment path
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: node scripts/pages-deployment-convergence-audit.mjs
      - name: Export current Consumer web app
        env:
          EXPO_PUBLIC_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
          EXPO_PUBLIC_ADSENSE_WEB_DISPLAY_SLOT: ${{ vars.EXPO_PUBLIC_ADSENSE_WEB_DISPLAY_SLOT }}
        run: npm run web:export --workspace @kleenest/consumer-mobile
      - name: Export Kleenest Business Web
        env:
          EXPO_PUBLIC_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: npm run web:export --workspace @kleenest/business-mobile
      - name: Verify Kleenest Business Web
        run: |
          test -s apps/business-mobile/dist/index.html
          grep -q "Kleenest Business" apps/business-mobile/dist/index.html
      - name: Export Kleenest Fleet Web
        env:
          EXPO_PUBLIC_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: npm run web:export --workspace @kleenest/fleet-mobile
      - name: Verify Kleenest Fleet Web
        run: |
          test -s apps/fleet-mobile/dist/index.html
          grep -q "Kleenest Fleet" apps/fleet-mobile/dist/index.html
      - name: Export KleenestOS Web
        env:
          EXPO_PUBLIC_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: npm run web:export --workspace @kleenest/owner-mobile
      - name: Verify KleenestOS Web
        run: |
          test -s apps/platform-mobile/dist/index.html
          grep -q "KleenestOS" apps/platform-mobile/dist/index.html
      - name: Prepare installable Consumer Web PWA
        env:
          EXPO_PUBLIC_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
        run: |
          node scripts/prepare-consumer-web-pwa.mjs
          test -s apps/consumer-mobile/dist/manifest.webmanifest
          test -s apps/consumer-mobile/dist/sw.js
          test -s apps/consumer-mobile/dist/app-icon.png
          test -s apps/consumer-mobile/dist/app-icon-512.svg
          test -s apps/consumer-mobile/dist/profile/index.html
      - name: Build installable Kleenest Mail client
        env:
          VITE_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: |
          npx vite build --config apps/mail-client/vite.config.js
          cp apps/consumer-mobile/assets/app-icon.png apps/mail-client/dist/app-icon.png
          cp public/app-icon-512.svg apps/mail-client/dist/app-icon-512.svg
          node scripts/kleenest-mail-pwa-audit.mjs
          test -s apps/mail-client/dist/index.html
          test -s apps/mail-client/dist/manifest.webmanifest
          test -s apps/mail-client/dist/sw.js
      - name: Resolve freshest verified Consumer APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/resolve-consumer-apk-baseline.mjs --target-sha "$TARGET_SHA"
      - name: Fetch Consumer APK baseline commit
        run: git fetch --no-tags --depth=1 origin "${{ steps.apk.outputs.source_sha }}"
      - name: Assess Consumer native and OTA drift
        run: node scripts/consumer-release-drift-audit.mjs --baseline "${{ steps.apk.outputs.source_sha }}" --report-only --json-out "$RUNNER_TEMP/Kleenest-release-state.json"
      - name: Stamp deployed Pages URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=process.env.RUNNER_TEMP+'/Kleenest-release-state.json';
          const state=JSON.parse(fs.readFileSync(path,'utf8'));
          const raw=String(process.env.PAGES_BASE_URL||'').replace(/\/+$/,'');
          if(!raw)throw new Error('GitHub Pages base URL is unavailable.');
          state.pagesBaseUrl=raw+'/';
          state.pagesBasePath=String(process.env.PAGES_BASE_PATH||'');
          fs.writeFileSync(path,JSON.stringify(state,null,2)+'\n');
          NODE
      - name: Download freshest verified Consumer APK
        uses: actions/download-artifact@v4
        with:
          name: Kleenest-Consumer-Standalone-APK
          path: installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.apk.outputs.run_id }}
      - name: Publish direct installer and legal resources alongside web app
        run: |
          set -euo pipefail
          test -s installer/Kleenest-Consumer.apk
          cp installer/Kleenest-Consumer.apk apps/consumer-mobile/dist/Kleenest-Consumer.apk
          cp "$RUNNER_TEMP/Kleenest-release-state.json" apps/consumer-mobile/dist/Kleenest-release-state.json
          mkdir -p apps/consumer-mobile/dist/legal
          cp public/legal/*.html apps/consumer-mobile/dist/legal/
          rm -rf apps/consumer-mobile/dist/developer apps/consumer-mobile/dist/owner apps/consumer-mobile/dist/business apps/consumer-mobile/dist/fleet
          mkdir -p apps/consumer-mobile/dist/developer apps/consumer-mobile/dist/owner apps/consumer-mobile/dist/business apps/consumer-mobile/dist/fleet
          cp -R apps/developer-portal/static/. apps/consumer-mobile/dist/developer/
          cp -R apps/platform-mobile/dist/. apps/consumer-mobile/dist/owner/
          cp -R apps/business-mobile/dist/. apps/consumer-mobile/dist/business/
          cp -R apps/fleet-mobile/dist/. apps/consumer-mobile/dist/fleet/
          mkdir -p apps/consumer-mobile/dist/mail
          cp -R apps/mail-client/dist/. apps/consumer-mobile/dist/mail/
          test -s apps/consumer-mobile/dist/mail/index.html
          test -s apps/consumer-mobile/dist/mail/manifest.webmanifest
          test -s apps/consumer-mobile/dist/mail/sw.js
          fleet_routes="auth planner dispatch assets operations member nearby execution signals metrics sync maintenance insights enterprise premium progression capabilities workspaces onboarding demo notifications support terms privacy account"
          for route in $fleet_routes; do
            mkdir -p "apps/consumer-mobile/dist/fleet/$route"
            cp apps/fleet-mobile/dist/index.html "apps/consumer-mobile/dist/fleet/$route/index.html"
          done
          owner_routes="auth control pilots developers operations devices businesses moderation access accounts history intelligence reports progression capabilities audit data notifications support terms privacy account"
          for route in $owner_routes; do
            mkdir -p "apps/consumer-mobile/dist/owner/$route"
            cp apps/platform-mobile/dist/index.html "apps/consumer-mobile/dist/owner/$route/index.html"
          done
          business_routes="auth tools locations engagement operations devices fleet analytics workspaces onboarding demo profile members assistant reviews qr-studio qr-designer live-network progression intelligence capabilities growth prevention trust-operations governance enterprise-economy enterprise-locations enterprise-location-admin enterprise partners notifications support terms privacy account"
          for route in $business_routes; do
            mkdir -p "apps/consumer-mobile/dist/business/$route"
            cp apps/business-mobile/dist/index.html "apps/consumer-mobile/dist/business/$route/index.html"
          done
          for legal in privacy account-deletion terms community-guidelines; do
            test -s "apps/consumer-mobile/dist/legal/${legal}.html"
          done
          test -s apps/consumer-mobile/dist/developer/index.html
          test -s apps/consumer-mobile/dist/developer/manifest.webmanifest
          test -s apps/consumer-mobile/dist/developer/sw.js
          test -s apps/consumer-mobile/dist/owner/index.html
          test -s apps/consumer-mobile/dist/owner/control/index.html
          test -s apps/consumer-mobile/dist/owner/auth/index.html
          test -s apps/consumer-mobile/dist/business/index.html
          test -s apps/consumer-mobile/dist/fleet/index.html
          test -s apps/consumer-mobile/dist/fleet/auth/index.html
          test -s apps/consumer-mobile/dist/fleet/dispatch/index.html
          test -s apps/consumer-mobile/dist/fleet/nearby/index.html
          test -s apps/consumer-mobile/dist/fleet/operations/index.html
          test -s apps/consumer-mobile/dist/fleet/notifications/index.html
          test -s apps/consumer-mobile/dist/business/tools/index.html
          test -s apps/consumer-mobile/dist/business/devices/index.html
          test -s apps/consumer-mobile/dist/owner/devices/index.html
          test -s apps/consumer-mobile/dist/business/fleet/index.html
          test -s apps/consumer-mobile/dist/business/analytics/index.html
          test -s apps/consumer-mobile/dist/business/enterprise-location-admin/index.html
          test -s apps/consumer-mobile/dist/Kleenest-release-state.json
          grep -q "Kleenest Developer Portal" apps/consumer-mobile/dist/developer/index.html
          grep -q "Browser token" apps/consumer-mobile/dist/developer/index.html
          public_routes="install for-you for-business trust support privacy terms community-guidelines account-deletion"
          for route in $public_routes; do
            mkdir -p "apps/consumer-mobile/dist/$route"
            cp apps/consumer-mobile/dist/index.html "apps/consumer-mobile/dist/$route/index.html"
            test -s "apps/consumer-mobile/dist/$route/index.html"
          done
          node scripts/prepare-consumer-web-seo.mjs
          test -s apps/consumer-mobile/dist/sitemap.xml
          test -s apps/consumer-mobile/dist/robots.txt
          grep -q "https://kleenest.us/" apps/consumer-mobile/dist/sitemap.xml
          cp apps/consumer-mobile/dist/index.html apps/consumer-mobile/dist/404.html
          touch apps/consumer-mobile/dist/.nojekyll
          APK_FILE="apps/consumer-mobile/dist/Kleenest-Consumer.apk"
          test -s "$APK_FILE"
          APK_BYTES="$(wc -c < "$APK_FILE" | tr -d '[:space:]')"
          test "$APK_BYTES" -gt 1000000
          unzip -t "$APK_FILE" >/dev/null
          sha256sum "$APK_FILE" > apps/consumer-mobile/dist/Kleenest-Consumer.apk.sha256
          grep -q "Kleenest-Consumer.apk" apps/consumer-mobile/dist/Kleenest-Consumer.apk.sha256
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/consumer-mobile/dist
      - name: Deploy Consumer web app, Business Web, Fleet Web, KleenestOS Web, Developer Portal, legal resources, and direct APK
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve deployed release state
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-deployed-release-state
          path: ${{ runner.temp }}/Kleenest-release-state.json
          retention-days: 7
      - name: Dispatch live Installation Center smoke
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceSha = process.env.SOURCE_SHA;
            const pagesBaseUrl = String(process.env.PAGES_BASE_URL || '').replace(/\/+$/,'');
            if (!sourceSha) throw new Error('Published source SHA is unavailable.');
            if (!pagesBaseUrl) throw new Error('Published Pages base URL is unavailable.');
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'install-center-smoke.yml',
              ref: 'main',
              inputs: {
                source_sha: sourceSha,
                pages_base_url: pagesBaseUrl,
              },
            });
            core.info(`Dispatched live Installation Center smoke for ${sourceSha} at ${pagesBaseUrl}`);
