name: Overture Worker Checks
on:
  pull_request:
    paths:
      - 'scripts/overture_hydration_worker.py'
      - 'scripts/test_overture_hydration_worker.py'
      - 'scripts/requirements-overture.txt'
      - '.github/workflows/overture-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements-overture.txt
      - name: Compile worker and tests
        run: python -m py_compile scripts/overture_hydration_worker.py scripts/test_overture_hydration_worker.py
      - name: Verify worker invariants
        run: python -m unittest scripts/test_overture_hydration_worker.py
      - name: Validate DuckDB spatial extraction locally
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect()
          c.execute('INSTALL spatial; LOAD spatial;')
          geom=c.execute("SELECT ST_AsWKB(ST_Point(-90.0,38.0))").fetchone()[0]
          c.execute('CREATE TABLE sample (id VARCHAR, names STRUCT(primary VARCHAR), categories STRUCT(primary VARCHAR), geometry BLOB, bbox STRUCT(xmin DOUBLE, xmax DOUBLE, ymin DOUBLE, ymax DOUBLE))')
          c.execute('INSERT INTO sample VALUES (?, ?, ?, ?, ?)', ['a', {'primary':'Sample'}, {'primary':'restaurant'}, geom, {'xmin':-90.0,'xmax':-90.0,'ymin':38.0,'ymax':38.0}])
          rows=c.execute('SELECT ST_X(ST_GeomFromWKB(geometry)),ST_Y(ST_GeomFromWKB(geometry)) FROM sample').fetchall()
          assert rows == [(-90.0,38.0)], rows
          PY
