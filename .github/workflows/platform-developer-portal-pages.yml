name: Deploy Kleenest Developer Portal

on:
  push:
    branches: [main]
    paths:
      - "apps/developer-portal/static/**"
      - ".github/workflows/platform-developer-portal-pages.yml"
      - "scripts/platform-developer-portal-hosting-audit.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kleenest-developer-portal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate portal hosting contract
        run: node scripts/platform-developer-portal-hosting-audit.mjs
      - name: Prepare static portal
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp apps/developer-portal/static/index.html _site/index.html
          cp apps/developer-portal/static/index.html _site/404.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Developer Portal
        id: deployment
        uses: actions/deploy-pages@v4
