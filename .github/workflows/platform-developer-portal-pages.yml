name: Deploy Kleenest Developer Portal

on:
  push:
    branches: [main]
    paths:
      - "apps/developer-portal/static/**"
      - "apps/platform-mobile/app/developers.tsx"
      - ".github/workflows/platform-developer-portal-pages.yml"
      - "scripts/platform-developer-portal-hosting-audit.mjs"
  pull_request:
    branches: [main]
    paths:
      - "apps/developer-portal/static/**"
      - "apps/platform-mobile/app/developers.tsx"
      - ".github/workflows/platform-developer-portal-pages.yml"
      - "scripts/platform-developer-portal-hosting-audit.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kleenest-developer-portal-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate portal hosting and developer experience contract
        run: node scripts/platform-developer-portal-hosting-audit.mjs
      - name: Prepare static portal
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/developer
          cp apps/developer-portal/static/index.html _site/developer/index.html
          cp apps/developer-portal/static/index.html _site/developer/404.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./developer/">
          <title>Kleenest Platform</title>
          <a href="./developer/">Open the Kleenest Developer Portal</a>
          HTML
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/developer/index.html
          test -s _site/developer/404.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Developer Portal
        id: deployment
        uses: actions/deploy-pages@v4