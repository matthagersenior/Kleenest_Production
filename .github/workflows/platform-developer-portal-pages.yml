name: Validate Kleenest Developer Portal

on:
  push:
    branches: [main]
    paths:
      - "apps/developer-portal/static/**"
      - "apps/platform-mobile/app/developers.tsx"
      - ".github/workflows/platform-developer-portal-pages.yml"
      - "scripts/platform-developer-portal-hosting-audit.mjs"
  pull_request:
    branches: [main]
    paths:
      - "apps/developer-portal/static/**"
      - "apps/platform-mobile/app/developers.tsx"
      - ".github/workflows/platform-developer-portal-pages.yml"
      - "scripts/platform-developer-portal-hosting-audit.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kleenest-developer-portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate portal hosting and developer experience contract
        run: node scripts/platform-developer-portal-hosting-audit.mjs
      - name: Prepare static portal preview
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/developer
          cp apps/developer-portal/static/index.html _site/developer/index.html
          cp apps/developer-portal/static/index.html _site/developer/404.html
          test -s _site/developer/index.html
          test -s _site/developer/404.html
      - name: Preserve Developer Portal preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Developer-Portal-Preview
          path: _site
          retention-days: 3
          if-no-files-found: error
