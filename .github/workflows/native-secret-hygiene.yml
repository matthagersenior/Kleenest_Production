name: Native Secret Hygiene

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - '.gitignore'
      - '.github/workflows/native-secret-hygiene.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.gitignore'
      - '.github/workflows/native-secret-hygiene.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject native credential files and release secrets in git
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -Ei '(^|/)(google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p8|p12|mobileprovision)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Forbidden native credential/signing files are tracked:' >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          git check-ignore -q apps/consumer-mobile/google-services.json
          git check-ignore -q apps/business-mobile/google-services.json
          git check-ignore -q apps/fleet-mobile/google-services.json
          git check-ignore -q apps/platform-mobile/google-services.json
