name: Audit live Kleenest security and mobile performance
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/prepare-consumer-web-seo.mjs'
      - 'scripts/audit-live-consumer-web.mjs'
      - '.github/workflows/audit-live-consumer-web.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live headers, routes and mobile performance
        run: node scripts/audit-live-consumer-web.mjs
