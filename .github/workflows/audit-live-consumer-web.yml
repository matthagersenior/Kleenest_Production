name: Audit live Kleenest security and mobile performance
on:
  workflow_run:
    workflows: ["Publish Consumer Standalone Installer"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  live-audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live headers, routes and mobile performance
        run: node scripts/audit-live-consumer-web.mjs
