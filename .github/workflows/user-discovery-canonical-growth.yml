name: User Discovery Canonical Growth

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify user discovery grows canonical locations
        run: node scripts/user-discovery-canonical-growth-audit.mjs
