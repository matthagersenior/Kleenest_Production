name: EAS Android Cloud Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
  push:
    branches: [main]
    paths:
      - 'apps/consumer-mobile/**'
      - 'packages/mobile-core/**'
      - 'config/production-environment.json'
      - 'scripts/native-device-readiness-audit.mjs'
      - 'scripts/production-environment-contract-audit.mjs'
      - 'scripts/apply-consumer-explore-overlay-fix.mjs'
      - 'scripts/apply-consumer-progress-canonical.mjs'

permissions:
  contents: read

jobs:
  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 22a65aa3-c615-4c4f-a34d-084babc28fd7
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Require Expo automation token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured. Create an Expo access token and add it as the GitHub Actions secret EXPO_TOKEN." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify production and native contracts
        run: |
          node scripts/production-environment-contract-audit.mjs
          node scripts/native-device-readiness-audit.mjs
          npm run native:typecheck
      - name: Verify Expo identity
        working-directory: apps/consumer-mobile
        shell: bash
        run: |
          npx eas-cli@latest whoami
          npx expo config --type public > /tmp/kleenest-expo-config.txt
          grep -q "22a65aa3-c615-4c4f-a34d-084babc28fd7" /tmp/kleenest-expo-config.txt
      - name: Build Android on EAS and wait for native result
        working-directory: apps/consumer-mobile
        shell: bash
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json > "$GITHUB_WORKSPACE/eas-build-result.json"
          cat "$GITHUB_WORKSPACE/eas-build-result.json"
      - name: Validate EAS build result
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('eas-build-result.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          if (!build?.id) throw new Error('EAS build result did not contain a build id.');
          const status = String(build.status || '').toLowerCase();
          if (status && !['finished'].includes(status)) throw new Error(`EAS build ended with status ${build.status}.`);
          const artifactUrl = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || '';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Kleenest EAS Android build completed\nProfile: ${process.env.PROFILE}\nBuild ID: ${build.id}\nStatus: ${build.status || 'finished'}\n${artifactUrl ? `Artifact: ${artifactUrl}\n` : ''}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eas-android-build-result-${{ github.run_id }}
          path: eas-build-result.json
          if-no-files-found: warn
          retention-days: 30
