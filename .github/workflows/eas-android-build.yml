name: EAS Android Store Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
  push:
    branches: [main]
    paths:
      - 'apps/consumer-mobile/**'
      - 'packages/mobile-core/**'
      - 'config/production-environment.json'
      - 'scripts/native-device-readiness-audit.mjs'
      - 'scripts/production-environment-contract-audit.mjs'
      - 'scripts/apply-consumer-explore-overlay-fix.mjs'
      - 'scripts/apply-consumer-progress-canonical.mjs'

permissions:
  contents: read

jobs:
  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 22a65aa3-c615-4c4f-a34d-084babc28fd7
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      KLEENEST_STANDALONE_ANDROID: '1'
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require Expo automation token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured. Create an Expo access token and add it as the GitHub Actions secret EXPO_TOKEN." >&2
            exit 1
          fi
      - name: Install dependencies without mutating release lock state
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Guard EAS local build archive from transient npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE="$(find . -path './node_modules' -prune -o -name package-lock.json -print -quit)"
          if [ -n "$LOCKFILE" ]; then
            echo "Unexpected transient npm lockfile would make the EAS local workspace install non-reproducible: $LOCKFILE" >&2
            exit 1
          fi
      - name: Verify production and native contracts
        run: |
          node scripts/production-environment-contract-audit.mjs
          node scripts/native-device-readiness-audit.mjs
          node scripts/native-consumer-presentation-convergence-audit.mjs
          npm run native:typecheck
      - name: Verify Expo identity and local Android toolchain
        working-directory: apps/consumer-mobile
        shell: bash
        run: |
          npx eas-cli@latest whoami
          npx expo config --type public > /tmp/kleenest-expo-config.txt
          grep -q "22a65aa3-c615-4c4f-a34d-084babc28fd7" /tmp/kleenest-expo-config.txt
          test -n "$ANDROID_HOME"
          java -version
      - name: Build signed Android artifact locally with EAS
        working-directory: apps/consumer-mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = "production" ]; then
            EXT=aab
          else
            EXT=apk
          fi
          OUTPUT="$GITHUB_WORKSPACE/Kleenest-Consumer-${PROFILE}.${EXT}"
          npx eas-cli@latest build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --local \
            --output "$OUTPUT"
          test -s "$OUTPUT"
          sha256sum "$OUTPUT" | tee "$OUTPUT.sha256"
          printf '{"profile":"%s","artifact":"%s","sha":"%s","builder":"eas-local"}\n' \
            "$PROFILE" "$(basename "$OUTPUT")" "$GITHUB_SHA" > "$GITHUB_WORKSPACE/eas-build-result.json"
      - name: Inspect Android signing certificate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = "production" ]; then EXT=aab; else EXT=apk; fi
          ARTIFACT="Kleenest-Consumer-${PROFILE}.${EXT}"
          CERT_INFO="$GITHUB_WORKSPACE/android-signing-cert.txt"

          if [ "$EXT" = "apk" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --print-certs "$ARTIFACT" | tee "$CERT_INFO"
            RAW_SHA1="$(awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}' "$CERT_INFO")"
          else
            keytool -printcert -jarfile "$ARTIFACT" | tee "$CERT_INFO"
            RAW_SHA1="$(awk -F'SHA1: ' '/SHA1:/{print $2; exit}' "$CERT_INFO")"
          fi

          if grep -Fqi 'CN=Android Debug' "$CERT_INFO"; then
            echo 'Refusing to publish an Android artifact signed with the Android Debug certificate.' >&2
            exit 1
          fi

          NORMALIZED_SHA1="$(printf '%s' "$RAW_SHA1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if ! printf '%s' "$NORMALIZED_SHA1" | grep -Eq '^[0-9A-F]{40}$'; then
            echo "Could not parse a valid SHA-1 certificate fingerprint from $ARTIFACT." >&2
            exit 1
          fi
          SIGNING_SHA1="$(printf '%s' "$NORMALIZED_SHA1" | sed 's/../&:/g;s/:$//')"
          printf 'Signing SHA-1: %s\n' "$SIGNING_SHA1" | tee -a "$CERT_INFO"
          printf '%s\n' "$SIGNING_SHA1" > "$GITHUB_WORKSPACE/android-signing-sha1.txt"
          {
            echo '### Consumer Android signing identity'
            echo "Package: com.kleenest.app"
            echo "Profile: $PROFILE"
            echo "Signing SHA-1: $SIGNING_SHA1"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate signed Android artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROFILE" = "production" ]; then EXT=aab; else EXT=apk; fi
          ARTIFACT="Kleenest-Consumer-${PROFILE}.${EXT}"
          test -s "$ARTIFACT"
          unzip -t "$ARTIFACT" >/dev/null
          test -s android-signing-sha1.txt
          grep -q '"builder":"eas-local"' eas-build-result.json
          {
            echo '### Kleenest signed Android artifact completed'
            echo "Profile: $PROFILE"
            echo "Artifact: $ARTIFACT"
            cat "$ARTIFACT.sha256"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-EAS-${{ env.PROFILE }}-${{ github.run_id }}
          path: |
            Kleenest-Consumer-${{ env.PROFILE }}.*
            eas-build-result.json
            android-signing-cert.txt
            android-signing-sha1.txt
          if-no-files-found: error
          retention-days: 30
