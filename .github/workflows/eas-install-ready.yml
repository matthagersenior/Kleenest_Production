name: Install-Ready Android Family

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/consumer-mobile/**'
      - 'apps/business-mobile/**'
      - 'apps/fleet-mobile/**'
      - 'apps/platform-mobile/**'
      - 'packages/mobile-core/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/eas-family-repair.yml'
      - '.github/workflows/eas-install-ready.yml'

permissions:
  contents: read

concurrency:
  group: install-ready-family-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify full production, parity, and type contracts
        run: |
          set -euo pipefail
          npm run audit
          npm run native:typecheck
          npm run operator:typecheck

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Consumer
            dir: apps/consumer-mobile
            package: com.kleenest.app
            project_id: 22a65aa3-c615-4c4f-a34d-084babc28fd7
            artifact: Kleenest-Consumer.apk
            secret_key: CONSUMER
            deeplink: kleenest://explore
          - app: Business
            dir: apps/business-mobile
            package: com.kleenest.business
            project_id: 15ac343b-81bf-459b-8c25-1b2fc8b293de
            artifact: Kleenest-Business.apk
            secret_key: BUSINESS
            deeplink: ''
          - app: Fleet
            dir: apps/fleet-mobile
            package: com.kleenest.fleet
            project_id: 90d1d6ff-1376-4065-a00c-7cf0415e4347
            artifact: Kleenest-Fleet.apk
            secret_key: FLEET
            deeplink: ''
          - app: KleenestOS
            dir: apps/platform-mobile
            package: com.kleenest.platform
            project_id: 9b5527b5-c8b1-47c1-a961-3e2d5e549a62
            artifact: Kleenest-Owner.apk
            secret_key: OWNER
            deeplink: ''
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ matrix.project_id }}
      GOOGLE_SERVICES_FILE: ./google-services.json
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      KLEENEST_STANDALONE_ANDROID: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Require Expo automation token
        run: test -n "$EXPO_TOKEN"
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Materialize package-specific Firebase config
        shell: bash
        env:
          CONSUMER_JSON: ${{ secrets.CONSUMER_GOOGLE_SERVICES_JSON_BASE64 }}
          BUSINESS_JSON: ${{ secrets.BUSINESS_GOOGLE_SERVICES_JSON_BASE64 }}
          FLEET_JSON: ${{ secrets.FLEET_GOOGLE_SERVICES_JSON_BASE64 }}
          OWNER_JSON: ${{ secrets.OWNER_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          case '${{ matrix.secret_key }}' in
            CONSUMER) value="${CONSUMER_JSON:-}" ;;
            BUSINESS) value="${BUSINESS_JSON:-}" ;;
            FLEET) value="${FLEET_JSON:-}" ;;
            OWNER) value="${OWNER_JSON:-}" ;;
            *) value='' ;;
          esac
          test -n "$value" || { echo 'Firebase config secret missing for ${{ matrix.app }}.' >&2; exit 1; }
          printf '%s' "$value" | base64 --decode > '${{ matrix.dir }}/google-services.json'
          node - <<'NODE'
          const fs=require('fs');
          const file='${{ matrix.dir }}/google-services.json';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!config.client?.some(c=>c.client_info?.android_client_info?.package_name==='${{ matrix.package }}')) throw new Error('Firebase config does not authorize ${{ matrix.package }}');
          NODE
      - name: Inject cloud-build environment into candidate profile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const file='${{ matrix.dir }}/eas.json';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          const profile=config.build?.candidate;
          if(!profile) throw new Error('candidate EAS profile missing');
          profile.env={
            ...(profile.env||{}),
            EAS_PROJECT_ID:'${{ matrix.project_id }}',
            KLEENEST_STANDALONE_ANDROID:'1',
            GOOGLE_SERVICES_FILE:'./google-services.json',
            EXPO_PUBLIC_SUPABASE_URL:'https://ssgesjzdvdsqacdtasje.supabase.co',
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:'sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL',
            KLEENEST_RELEASE_CHANNEL:'candidate'
          };
          fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          NODE
      - name: Include ephemeral Firebase config in EAS archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT_IGNORE="$GITHUB_WORKSPACE/.easignore"
          if [ -f "$GITHUB_WORKSPACE/.gitignore" ]; then cp "$GITHUB_WORKSPACE/.gitignore" "$ROOT_IGNORE"; else : > "$ROOT_IGNORE"; fi
          printf '\n# CI-only Firebase include\n!${{ matrix.dir }}/google-services.json\n' >> "$ROOT_IGNORE"
          APP_IGNORE="$GITHUB_WORKSPACE/${{ matrix.dir }}/.easignore"
          if [ -f "$GITHUB_WORKSPACE/${{ matrix.dir }}/.gitignore" ]; then cp "$GITHUB_WORKSPACE/${{ matrix.dir }}/.gitignore" "$APP_IGNORE"; else : > "$APP_IGNORE"; fi
          printf '\n# CI-only Firebase include\n!google-services.json\n' >> "$APP_IGNORE"
          test -s '${{ matrix.dir }}/google-services.json'
      - name: Verify app identity before build
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest whoami
          npx expo config --type public --json > "$RUNNER_TEMP/expo-${{ matrix.app }}.json"
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/expo-${{ matrix.app }}.json','utf8'));
          if(c.android?.package!=='${{ matrix.package }}') throw new Error('Android package mismatch');
          if(c.extra?.eas?.projectId!=='${{ matrix.project_id }}') throw new Error('EAS project mismatch');
          if(!c.android?.googleServicesFile) throw new Error('googleServicesFile missing');
          if(!c.icon||!c.android?.icon) throw new Error('Launcher icon missing');
          NODE
      - name: Build signed APK in EAS cloud
        id: eas
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/eas-${{ matrix.app }}.json"
          npx eas-cli@latest build --platform android --profile candidate --non-interactive --json > "$OUT"
          node - "$OUT" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs');
          const [jsonPath,outputPath]=process.argv.slice(2);
          const parsed=JSON.parse(fs.readFileSync(jsonPath,'utf8'));
          const build=Array.isArray(parsed)?parsed[0]:parsed;
          if(!build?.id) throw new Error('EAS returned no build id');
          if(String(build.status||'').toUpperCase()!=='FINISHED') throw new Error(`EAS build did not finish: ${build.status}`);
          const url=build.artifacts?.applicationArchiveUrl;
          if(!url) throw new Error('EAS returned no application archive URL');
          fs.appendFileSync(outputPath,`build_id=${build.id}\narchive_url=${url}\n`);
          NODE
      - name: Download signed APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors '${{ steps.eas.outputs.archive_url }}' -o '${{ matrix.artifact }}'
          test -s '${{ matrix.artifact }}'
      - name: Verify package, signature, and archive
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ matrix.artifact }}'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --print-certs "$APK" | tee '${{ matrix.app }}-signing-cert.txt'
          "$AAPT" dump badging "$APK" | tee '${{ matrix.app }}-badging.txt'
          grep -Fq "package: name='${{ matrix.package }}'" '${{ matrix.app }}-badging.txt'
          if grep -Fqi 'CN=Android Debug' '${{ matrix.app }}-signing-cert.txt'; then echo 'Refusing debug signing identity.' >&2; exit 1; fi
          RAW_SHA1="$(awk -F': ' '/certificate SHA-1 digest:/{print $NF; exit}' '${{ matrix.app }}-signing-cert.txt')"
          NORMALIZED_SHA1="$(printf '%s' "$RAW_SHA1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          printf '%s' "$NORMALIZED_SHA1" | grep -Eq '^[0-9A-F]{40}$'
          SIGNING_SHA1="$(printf '%s' "$NORMALIZED_SHA1" | sed 's/../&:/g;s/:$//')"
          printf '%s\n' "$SIGNING_SHA1" > '${{ matrix.app }}-signing-sha1.txt'
          sha256sum "$APK" > "$APK.sha256"
          unzip -t "$APK" >/dev/null
      - name: Enable KVM
        shell: bash
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 16 install/startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-startup-smoke.sh '${{ matrix.artifact }}' '${{ matrix.package }}' '${{ matrix.app }}' '${{ matrix.deeplink }}' 'android-startup-logs/${{ matrix.app }}'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-Install-Ready
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            ${{ matrix.app }}-signing-cert.txt
            ${{ matrix.app }}-signing-sha1.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-Startup-Diagnostics
          path: android-startup-logs/${{ matrix.app }}
          if-no-files-found: ignore
          retention-days: 7
