name: Temporary lockfile refresh for PR 563

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/_temporary-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/adsense-public-content-20261101' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate the transitive dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify published dependency advisories
        run: node scripts/npm-security-advisory-audit.mjs low
      - name: Commit generated lockfile to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate verified lockfile for patched Expo transitive dependencies"
            git push origin HEAD:refs/heads/fix/adsense-public-content-20261101
          fi
