name: Validate Kleenest Consumer Web Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kleenest-consumer-preview-validation
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preview deployment contract
        run: node scripts/pages-deployment-convergence-audit.mjs
      - name: Export canonical Expo consumer preview
        run: npm run web:export --workspace @kleenest/consumer-mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      - name: Validate SPA fallback
        run: |
          cp apps/consumer-mobile/dist/index.html apps/consumer-mobile/dist/404.html
          touch apps/consumer-mobile/dist/.nojekyll
          test -s apps/consumer-mobile/dist/index.html
          test -s apps/consumer-mobile/dist/404.html
      - name: Preserve web preview validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Web-Preview
          path: apps/consumer-mobile/dist
          retention-days: 3
          if-no-files-found: error
