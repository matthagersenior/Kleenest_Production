name: Validate Kleenest Consumer Web Preview

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main SHA validated by Production CI
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - apps/consumer-mobile/**
      - apps/platform-mobile/**
      - apps/mail-client/**
      - scripts/kleenest-mail-pwa-audit.mjs
      - apps/business-mobile/**
      - apps/fleet-mobile/**
      - public/manifest.webmanifest
      - public/sw.js
      - scripts/prepare-consumer-web-pwa.mjs
      - scripts/pages-deployment-convergence-audit.mjs
      - scripts/business-web-browser-smoke.spec.ts
      - scripts/consumer-real-world-browser-stress.spec.ts
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: kleenest-consumer-preview-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preview deployment contract
        run: node scripts/pages-deployment-convergence-audit.mjs
      - name: Export canonical Expo consumer preview
        run: npm run web:export --workspace @kleenest/consumer-mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
          EXPO_PUBLIC_ADSENSE_WEB_DISPLAY_SLOT: ${{ vars.EXPO_PUBLIC_ADSENSE_WEB_DISPLAY_SLOT }}
      - name: Export Kleenest Business Web
        run: npm run web:export --workspace @kleenest/business-mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      - name: Validate Kleenest Business Web export
        run: |
          test -s apps/business-mobile/dist/index.html
          grep -q "Kleenest Business" apps/business-mobile/dist/index.html
      - name: Install Business Web browser smoke runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser-smoke Kleenest Business Web
        env:
          BUSINESS_WEB_BASE: http://127.0.0.1:4173/Kleenest_Production/business/
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kleenest-business-web"
          mkdir -p "$RUNNER_TEMP/kleenest-business-web/Kleenest_Production/business"
          cp -R apps/business-mobile/dist/. "$RUNNER_TEMP/kleenest-business-web/Kleenest_Production/business/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/kleenest-business-web" >"$RUNNER_TEMP/business-web-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$BUSINESS_WEB_BASE" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BUSINESS_WEB_BASE" >/dev/null
          npx playwright test scripts/business-web-browser-smoke.spec.ts --reporter=line --workers=1
      - name: Export Kleenest Fleet Web
        run: npm run web:export --workspace @kleenest/fleet-mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      - name: Validate Kleenest Fleet Web export
        run: |
          test -s apps/fleet-mobile/dist/index.html
          grep -q "Kleenest Fleet" apps/fleet-mobile/dist/index.html
      - name: Export KleenestOS Web
        run: npm run web:export --workspace @kleenest/owner-mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      - name: Validate KleenestOS Web export
        run: |
          test -s apps/platform-mobile/dist/index.html
          grep -q "KleenestOS" apps/platform-mobile/dist/index.html
      - name: Build installable Kleenest Mail client
        env:
          VITE_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
        run: |
          npx vite build --config apps/mail-client/vite.config.js
          cp public/app-icon.png apps/mail-client/dist/app-icon.png
          cp public/app-icon-512.svg apps/mail-client/dist/app-icon-512.svg
          node scripts/kleenest-mail-pwa-audit.mjs
          test -s apps/mail-client/dist/index.html
          test -s apps/mail-client/dist/manifest.webmanifest
          test -s apps/mail-client/dist/sw.js
      - name: Prepare installable Consumer Web PWA
        env:
          EXPO_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_ADSENSE_CLIENT_ID }}
        run: |
          node scripts/prepare-consumer-web-pwa.mjs
          test -s apps/consumer-mobile/dist/manifest.webmanifest
          test -s apps/consumer-mobile/dist/sw.js
          test -s apps/consumer-mobile/dist/app-icon.png
          test -s apps/consumer-mobile/dist/app-icon-512.svg
          test -s apps/consumer-mobile/dist/profile/index.html
      - name: Browser-stress Kleenest Consumer Web
        env:
          CONSUMER_WEB_BASE: http://127.0.0.1:4174/Kleenest_Production/
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kleenest-consumer-web"
          mkdir -p "$RUNNER_TEMP/kleenest-consumer-web/Kleenest_Production"
          cp -R apps/consumer-mobile/dist/. "$RUNNER_TEMP/kleenest-consumer-web/Kleenest_Production/"
          python3 -m http.server 4174 --directory "$RUNNER_TEMP/kleenest-consumer-web" >"$RUNNER_TEMP/consumer-web-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$CONSUMER_WEB_BASE" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$CONSUMER_WEB_BASE" >/dev/null
          npx playwright test scripts/consumer-real-world-browser-stress.spec.ts --reporter=line --workers=1
      - name: Validate SPA fallback
        run: |
          cp apps/consumer-mobile/dist/index.html apps/consumer-mobile/dist/404.html
          touch apps/consumer-mobile/dist/.nojekyll
          test -s apps/consumer-mobile/dist/index.html
          test -s apps/consumer-mobile/dist/404.html
      - name: Preserve web preview validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Web-Preview
          path: |
            apps/consumer-mobile/dist
            apps/platform-mobile/dist
            apps/mail-client/dist
            apps/business-mobile/dist
            apps/fleet-mobile/dist
            test-results/consumer-stress
          retention-days: 3
          if-no-files-found: error
      - name: Dispatch Pages publisher after explicit main validation
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceSha = process.env.SOURCE_SHA;
            if (!sourceSha) throw new Error('Validated source SHA is unavailable.');
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'publish-standalone-installer.yml',
              ref: 'main',
              inputs: { source_sha: sourceSha },
            });
            core.info(`Dispatched Pages publisher for ${sourceSha}`);
