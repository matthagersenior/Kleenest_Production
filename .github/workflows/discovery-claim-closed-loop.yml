name: Discovery Claim Closed Loop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify discovery to claim closed loop
        run: node scripts/discovery-claim-closed-loop-audit.mjs
