name: Deploy Supabase Migrations to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: kleenest-production-database
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_ID: ssgesjzdvdsqacdtasje
      SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      SUPABASE_READINESS_AUDIENCE: kleenest-supabase-production-readiness
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Verify release SHA is current main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
      - name: Verify native Supabase production deployment
        run: |
          echo "Supabase GitHub Integration owns production migration deployment; GitHub main is the schema authority, and this gate requires exact bidirectional source/Production ledger convergence before OTA."
          node scripts/supabase-production-ledger-readiness.mjs
