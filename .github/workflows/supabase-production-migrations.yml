name: Deploy Supabase Migrations to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: kleenest-production-database
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ssgesjzdvdsqacdtasje
      SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      SUPABASE_READINESS_AUDIENCE: kleenest-supabase-production-readiness
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select production database release mode
        id: release_mode
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_ID" = "ssgesjzdvdsqacdtasje"
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
              echo "::error title=Incomplete Supabase deploy credentials::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must either both be configured or both be absent."
              exit 1
            fi
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
            echo "Privileged Supabase credentials are available; pending migrations will be deployed."
          else
            echo "mode=verify" >> "$GITHUB_OUTPUT"
            echo "Privileged Supabase credentials are not configured; requiring GitHub OIDC-authenticated production migration-ledger proof before release."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.release_mode.outputs.mode == 'deploy'
        with:
          version: latest
      - name: Link exact production project
        if: steps.release_mode.outputs.mode == 'deploy'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect migration history before deploy
        if: steps.release_mode.outputs.mode == 'deploy'
        run: supabase migration list
      - name: Preview pending production migrations
        if: steps.release_mode.outputs.mode == 'deploy'
        run: supabase db push --dry-run
      - name: Apply pending production migrations
        if: steps.release_mode.outputs.mode == 'deploy'
        run: supabase db push
      - name: Verify production migration history after deploy
        if: steps.release_mode.outputs.mode == 'deploy'
        run: |
          supabase migration list
          supabase db push --dry-run
      - name: Require OIDC-authenticated production migration ledger readiness
        if: steps.release_mode.outputs.mode == 'verify'
        run: node scripts/supabase-production-ledger-readiness.mjs
