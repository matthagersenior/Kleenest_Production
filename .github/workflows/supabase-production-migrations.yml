name: Deploy Supabase Migrations to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: kleenest-production-database
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ssgesjzdvdsqacdtasje
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify production database credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_ID" = "ssgesjzdvdsqacdtasje"
      - name: Link exact production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Inspect migration history before deploy
        run: supabase migration list
      - name: Preview pending production migrations
        run: supabase db push --dry-run
      - name: Apply pending production migrations
        run: supabase db push
      - name: Verify production migration history after deploy
        run: |
          supabase migration list
          supabase db push --dry-run
