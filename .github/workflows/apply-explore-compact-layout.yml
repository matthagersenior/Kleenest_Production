name: Apply Explore compact layout

on:
  push:
    branches:
      - fix/explore-compact-controls
    paths:
      - .github/workflows/apply-explore-compact-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explore-compact-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply approved layout transformation
        run: node scripts/apply-explore-compact-layout.mjs
      - name: Commit transformed Explore layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/consumer-mobile/features/AdaptiveExploreScreen.tsx scripts/native-map-authority-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: compact Consumer Explore controls"
          git push origin HEAD:fix/explore-compact-controls
