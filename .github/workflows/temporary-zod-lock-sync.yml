name: Temporary Zod Security Lock Sync
on:
  push:
    branches: [feature/consumer-native-widgets-release-20261022]
    paths:
      - 'package.json'
      - '.github/workflows/temporary-zod-lock-sync.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/consumer-native-widgets-release-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve and lock patched Zod from trusted npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to feature branch
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Resolve patched Zod 4.6.7 dependency lock'
          git push origin HEAD:feature/consumer-native-widgets-release-20261022
