name: Native Push Repair Candidates

# Retained only as a manual diagnostic entry point. Canonical installable builds
# are owned by android-family.yml after Production CI succeeds. Keeping this
# workflow off pull_request/push/schedule prevents repair jobs from outrunning
# verification or starving canonical CI runners.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-push-repair-candidates
  cancel-in-progress: true

jobs:
  manual-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use canonical CI-gated Android family workflow
        run: |
          echo 'Native Push Repair Candidates is diagnostic-only.'
          echo 'Run Production CI first; successful main CI triggers Build Kleenest App Family Android APKs.'
          echo 'Use the canonical Android-family artifacts for installable Consumer, Business, Fleet, and KleenestOS builds.'
