name: Build Kleenest App Family Android APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/mobile-core/**'
      - 'scripts/**'
      - 'config/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/android-family.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/mobile-core/**'
      - 'scripts/**'
      - 'config/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/android-family.yml'

permissions:
  contents: read

concurrency:
  group: kleenest-app-family-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-family:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Verify app family product contract
        run: |
          node scripts/product-parity-audit.mjs
          node scripts/capability-parity-ledger-audit.mjs
          node scripts/app-family-critical-path-audit.mjs
          node scripts/operator-functional-parity-audit.mjs
          node scripts/fleet-extended-operator-audit.mjs
          node scripts/fleet-offline-recovery-audit.mjs
      - run: npm run typecheck --workspace @kleenest/consumer-mobile
      - run: npm run typecheck --workspace @kleenest/business-mobile
      - run: npm run typecheck --workspace @kleenest/fleet-mobile
      - run: npm run typecheck --workspace @kleenest/owner-mobile

  build:
    needs: verify-family
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Consumer
            app_dir: apps/consumer-mobile
            workspace: '@kleenest/consumer-mobile'
            package_id: com.kleenest.app
            eas_project_id: 22a65aa3-c615-4c4f-a34d-084babc28fd7
            artifact: Kleenest-Consumer-Standalone-APK
            filename: Kleenest-Consumer.apk
            deeplink: kleenest://explore
          - app: Business
            app_dir: apps/business-mobile
            workspace: '@kleenest/business-mobile'
            package_id: com.kleenest.business
            eas_project_id: 15ac343b-81bf-459b-8c25-1b2fc8b293de
            artifact: Kleenest-Business-Standalone-APK
            filename: Kleenest-Business.apk
            deeplink: ''
          - app: Fleet
            app_dir: apps/fleet-mobile
            workspace: '@kleenest/fleet-mobile'
            package_id: com.kleenest.fleet
            eas_project_id: 90d1d6ff-1376-4065-a00c-7cf0415e4347
            artifact: Kleenest-Fleet-Standalone-APK
            filename: Kleenest-Fleet.apk
            deeplink: ''
          - app: KleenestOS
            app_dir: apps/platform-mobile
            workspace: '@kleenest/owner-mobile'
            package_id: com.kleenest.platform
            eas_project_id: 9b5527b5-c8b1-47c1-a961-3e2d5e549a62
            artifact: Kleenest-Owner-Standalone-APK
            filename: Kleenest-Owner.apk
            deeplink: ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      KLEENEST_STANDALONE_ANDROID: '1'
      EAS_PROJECT_ID: ${{ matrix.eas_project_id }}
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Verify app contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/app-family-critical-path-audit.mjs
          npm run typecheck --workspace '${{ matrix.workspace }}'
          test -s '${{ matrix.app_dir }}/assets/app-icon.png'
          cd '${{ matrix.app_dir }}'
          npx expo config --type public --json > "$RUNNER_TEMP/${{ matrix.app }}-expo-config.json"
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/${{ matrix.app }}-expo-config.json','utf8'));
          if(cfg.android?.package!=='${{ matrix.package_id }}') throw new Error(`Wrong Android package: ${cfg.android?.package}`);
          if(!cfg.icon||!cfg.android?.icon) throw new Error('Kleenest launcher icon is not configured.');
          NODE
          npx expo export --platform android --output-dir "$RUNNER_TEMP/${{ matrix.app }}-preflight" --clear
          test -n "$(find "$RUNNER_TEMP/${{ matrix.app }}-preflight" -type f -print -quit)"
      - name: Remove development-only Expo runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='${{ matrix.app_dir }}/package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          for(const section of ['dependencies','devDependencies','optionalDependencies']) if(pkg[section]) delete pkg[section]['expo-dev-client'];
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          NODE
          rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher node_modules/expo-dev-menu node_modules/expo-dev-menu-interface
      - name: Generate clean Android native project
        working-directory: ${{ matrix.app_dir }}
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install
      - name: Apply Kleenest launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          ICON='${{ matrix.app_dir }}/assets/app-icon.png'
          test -s "$ICON"
          ICON_SHA="$(sha256sum "$ICON" | awk '{print $1}')"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir='${{ matrix.app_dir }}/android/app/src/main/res/mipmap-'"$density"
            mkdir -p "$dir"
            rm -f "$dir"/ic_launcher.png "$dir"/ic_launcher.webp "$dir"/ic_launcher_round.png "$dir"/ic_launcher_round.webp "$dir"/ic_launcher_foreground.png "$dir"/ic_launcher_foreground.webp
            cp "$ICON" "$dir/ic_launcher.png"
            cp "$ICON" "$dir/ic_launcher_round.png"
            test "$(sha256sum "$dir/ic_launcher.png" | awk '{print $1}')" = "$ICON_SHA"
          done
          rm -f '${{ matrix.app_dir }}/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' '${{ matrix.app_dir }}/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml'
      - name: Configure release architectures and Gradle memory
        shell: bash
        run: |
          set -euo pipefail
          PROPS='${{ matrix.app_dir }}/android/gradle.properties'
          if grep -q '^reactNativeArchitectures=' "$PROPS"; then sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' "$PROPS"; else printf '\nreactNativeArchitectures=arm64-v8a,x86_64\n' >> "$PROPS"; fi
          if grep -q '^org.gradle.jvmargs=' "$PROPS"; then sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8|' "$PROPS"; else printf '\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n' >> "$PROPS"; fi
          if grep -q '^org.gradle.workers.max=' "$PROPS"; then sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' "$PROPS"; else printf '\norg.gradle.workers.max=2\n' >> "$PROPS"; fi
      - name: Verify release dependency graph
        working-directory: ${{ matrix.app_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > "$RUNNER_TEMP/${{ matrix.app }}-release-deps.txt"
          if grep -Eqi 'expo-dev-client|expo-dev-launcher|expo-dev-menu' "$RUNNER_TEMP/${{ matrix.app }}-release-deps.txt"; then echo 'Development-only Expo runtime leaked into release dependencies.' >&2; exit 1; fi
      - name: Build release APK
        working-directory: ${{ matrix.app_dir }}/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Locate and verify release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find '${{ matrix.app_dir }}/android/app/build/outputs/apk/release' -maxdepth 1 -type f -name '*.apk' ! -name '*androidTest*' ! -name '*test*' | sort | head -n1)"
          test -n "${APK:-}" && test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          LISTING="$RUNNER_TEMP/${{ matrix.app }}-apk-listing.txt"
          BUNDLE="$RUNNER_TEMP/${{ matrix.app }}-index.android.bundle"
          BADGING="$RUNNER_TEMP/${{ matrix.app }}-badging.txt"
          unzip -Z1 "$APK" > "$LISTING"
          grep -Fxq 'lib/arm64-v8a/libreactnative.so' "$LISTING"
          grep -Fxq 'lib/x86_64/libreactnative.so' "$LISTING"
          grep -Eq '^lib/arm64-v8a/(libhermes|libhermesvm)\.so$' "$LISTING"
          grep -Eq '^lib/x86_64/(libhermes|libhermesvm)\.so$' "$LISTING"
          grep -Fxq 'assets/index.android.bundle' "$LISTING"
          unzip -p "$APK" assets/index.android.bundle > "$BUNDLE"
          test -s "$BUNDLE"
          grep -aFq 'ssgesjzdvdsqacdtasje.supabase.co' "$BUNDLE"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          if [ ! -x "$AAPT" ]; then AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n1)"; fi
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > "$BADGING"
          grep -Fq "package: name='${{ matrix.package_id }}'" "$BADGING"
          if grep -Fq 'application-debuggable' "$BADGING"; then echo '${{ matrix.app }} APK is debuggable.' >&2; exit 1; fi
      - name: Enable KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 16 startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash scripts/android-startup-smoke.sh '${{ steps.apk.outputs.path }}' '${{ matrix.package_id }}' '${{ matrix.app }}' '${{ matrix.deeplink }}' 'android-startup-logs/${{ matrix.app }}'
      - name: Stage verified APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp '${{ steps.apk.outputs.path }}' 'dist/${{ matrix.filename }}'
          sha256sum 'dist/${{ matrix.filename }}' > 'dist/${{ matrix.filename }}.sha256'
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.filename }}
            dist/${{ matrix.filename }}.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-${{ matrix.app }}-Startup-Diagnostics
          path: android-startup-logs/${{ matrix.app }}
          if-no-files-found: ignore
          retention-days: 7
