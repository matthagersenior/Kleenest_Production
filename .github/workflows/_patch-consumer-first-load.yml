# synchronize PR so canonical main maintenance workflow applies the implementation
name: Apply Consumer first-load implementation

on:
  push:
    branches:
      - fix/consumer-explore-first-load
    paths:
      - .github/workflows/_patch-consumer-first-load.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consumer-explore-first-load
      - name: Apply targeted Explore reliability patch
        run: |
          echo "Branch-local workflow is intentionally superseded by the canonical main maintenance workflow."
