name: Overture Places Ingestion

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Optional WEST,SOUTH,EAST,NORTH. Empty processes the hydration queue.'
        required: false
        type: string
      release:
        description: 'Optional Overture release, e.g. 2026-09-23.1. Empty uses STAC latest.'
        required: false
        type: string
      max_jobs:
        description: 'Maximum queued search/market hydration jobs to process.'
        required: false
        default: '4'
        type: string
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: overture-place-hydration
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KLEENEST_PROD_SERVICE_ROLE_KEY }}
      INPUT_BBOX: ${{ inputs.bbox }}
      INPUT_RELEASE: ${{ inputs.release }}
      INPUT_MAX_JOBS: ${{ inputs.max_jobs }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify production ingestion credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "Missing KLEENEST_PROD_SERVICE_ROLE_KEY"
            exit 1
          }

      - name: Install Overture query runtime
        run: pip install duckdb

      - name: Verify Overture transformer
        run: python3 scripts/overture-places-ingest.py --self-test

      - name: Hydrate Overture places
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_RELEASE:-}" ]; then
            args+=(--release "$INPUT_RELEASE")
          fi
          if [ -n "${INPUT_BBOX:-}" ]; then
            args+=(--bbox "$INPUT_BBOX")
          else
            args+=(--process-queue --max-jobs "${INPUT_MAX_JOBS:-4}")
          fi
          python3 scripts/overture-places-ingest.py "${args[@]}"
