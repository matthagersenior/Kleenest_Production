name: PR Completion Guard

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows:
      - "Production CI"
      - "Validate Kleenest Consumer Web Preview"
      - "App Family Product Parity"
      - "Security Gate"
      - "Business Enterprise Truth Gate"
      - "Native Secret Hygiene"
      - "Expo Push Token Validation"
      - "User Discovery Canonical Growth"
      - "Discovery Claim Closed Loop"
      - "Progression Reward Arcade Contract"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr-completion-guard
  cancel-in-progress: false

jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh, retry, and merge eligible PRs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoFullName = `${owner}/${repo}`;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            for (const pr of prs) {
              core.info(`PR #${pr.number}: ${pr.title}`);

              if (pr.draft) {
                core.info('  skip: draft');
                continue;
              }

              if (!pr.head.repo || pr.head.repo.full_name !== repoFullName) {
                core.info('  skip: fork/external head');
                continue;
              }

              const runsResponse = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: pr.head.sha,
                event: 'pull_request',
                per_page: 100,
              });

              const latestRuns = new Map();
              for (const run of runsResponse.data.workflow_runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))) {
                if (!latestRuns.has(run.name)) latestRuns.set(run.name, run);
              }

              const ci = latestRuns.get('Production CI');
              if (!ci) {
                core.info('  skip: Production CI has not started for current head');
                continue;
              }

              const unfinishedRuns = [...latestRuns.values()].filter((run) => run.status !== 'completed');
              if (unfinishedRuns.length) {
                core.info(`  skip: checks still running: ${unfinishedRuns.map((run) => run.name).join(', ')}`);
                continue;
              }

              const retryable = new Set(['failure', 'cancelled', 'timed_out']);
              let retried = false;
              for (const run of latestRuns.values()) {
                if (!retryable.has(run.conclusion) || (run.run_attempt || 1) >= 2) continue;
                core.warning(`  ${run.name} ended ${run.conclusion}; retrying failed jobs once (run ${run.id})`);
                try {
                  await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
                  retried = true;
                } catch (error) {
                  core.warning(`  retry failed for ${run.name}: ${error.message}`);
                }
              }
              if (retried) continue;

              const badRuns = [...latestRuns.values()].filter((run) =>
                !['success', 'neutral', 'skipped'].includes(String(run.conclusion || ''))
              );
              if (badRuns.length) {
                core.warning(`  blocked: workflow source fix required: ${badRuns.map((run) => `${run.name}=${run.conclusion}`).join(', ')}`);
                continue;
              }

              const checksResponse = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const relevantChecks = checksResponse.data.check_runs.filter((check) => check.name !== 'completion');
              const pendingChecks = relevantChecks.filter((check) => check.status !== 'completed');
              if (pendingChecks.length) {
                core.info(`  skip: check runs still pending: ${pendingChecks.map((check) => check.name).join(', ')}`);
                continue;
              }
              const badChecks = relevantChecks.filter((check) =>
                !['success', 'neutral', 'skipped'].includes(String(check.conclusion || ''))
              );
              if (badChecks.length) {
                core.warning(`  blocked: check source fix required: ${badChecks.map((check) => `${check.name}=${check.conclusion}`).join(', ')}`);
                continue;
              }

              const fresh = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });

              if (fresh.data.mergeable_state === 'behind') {
                core.info('  branch is behind main; requesting GitHub branch refresh');
                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number: pr.number,
                    expected_head_sha: pr.head.sha,
                  });
                  core.info('  branch refresh requested; CI will run again');
                } catch (error) {
                  core.warning(`  branch refresh failed: ${error.message}`);
                }
                continue;
              }

              try {
                const result = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  sha: pr.head.sha,
                });

                if (!result.data.merged) {
                  core.info(`  not mergeable yet: ${result.data.message || 'repository rules still blocking'}`);
                  continue;
                }

                core.info(`  merged PR #${pr.number}: ${result.data.sha}`);

                if (pr.head.ref !== 'main') {
                  try {
                    await github.rest.git.deleteRef({
                      owner,
                      repo,
                      ref: `heads/${pr.head.ref}`,
                    });
                    core.info(`  deleted branch ${pr.head.ref}`);
                  } catch (error) {
                    core.warning(`  merged, but branch cleanup failed: ${error.message}`);
                  }
                }
              } catch (error) {
                core.info(`  merge deferred: ${error.message}`);
              }
            }
