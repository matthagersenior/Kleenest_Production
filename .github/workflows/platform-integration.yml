name: Platform Integration CI

on:
  push:
    branches:
      - "platform/**"
    paths:
      - "packages/platform-core/**"
      - "packages/sdk-js/**"
      - "packages/map-layer/**"
      - "packages/widget/**"
      - "packages/route-sdk/**"
      - "packages/webhook-types/**"
      - "supabase/functions/platform-api/**"
      - "supabase/functions/platform-partner-admin/**"
      - "supabase/functions/platform-developer-portal/**"
      - "supabase/functions/platform-integration-smoke/**"
      - "supabase/functions/platform-distribution/**"
      - "supabase/functions/deliver-platform-webhooks/**"
      - "supabase/migrations/**"
      - "apps/developer-portal/**"
      - "mcp/kleenest-mcp/**"
      - "docs/platform/**"
      - "scripts/platform-integration-contract-audit.mjs"
      - "scripts/platform-partner-authority-audit.mjs"
      - "scripts/platform-external-beta-audit.mjs"
      - "scripts/platform-distribution-v1-audit.mjs"
      - "scripts/platform-public-client-token-audit.mjs"
      - "tsconfig.platform.json"
      - "package-lock.json"
      - ".github/workflows/platform-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/platform-core/**"
      - "packages/sdk-js/**"
      - "packages/map-layer/**"
      - "packages/widget/**"
      - "packages/route-sdk/**"
      - "packages/webhook-types/**"
      - "supabase/functions/platform-api/**"
      - "supabase/functions/platform-partner-admin/**"
      - "supabase/functions/platform-distribution/**"
      - "supabase/functions/platform-integration-smoke/**"
      - "supabase/functions/platform-developer-portal/**"
      - "supabase/functions/deliver-platform-webhooks/**"
      - "supabase/migrations/**"
      - "apps/developer-portal/**"
      - "mcp/kleenest-mcp/**"
      - "docs/platform/**"
      - "scripts/platform-integration-contract-audit.mjs"
      - "scripts/platform-partner-authority-audit.mjs"
      - "scripts/platform-distribution-v1-audit.mjs"
      - "scripts/platform-external-beta-audit.mjs"
      - "tsconfig.platform.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install production workspace
        run: npm ci --no-audit --no-fund
      - name: Platform contract audit
        run: node scripts/platform-integration-contract-audit.mjs
      - name: Partner platform authority audit
        run: node scripts/platform-partner-authority-audit.mjs
      - name: External beta onboarding audit
        run: node scripts/platform-external-beta-audit.mjs
      - name: Distribution v1 audit
        run: node scripts/platform-distribution-v1-audit.mjs
      - name: Publishable client-token audit
        run: node scripts/platform-public-client-token-audit.mjs
      - name: Platform package typecheck
        run: npx tsc -p tsconfig.platform.json --noEmit
      - name: REST Edge Function check
        shell: bash
        run: |
          if [ -f supabase/functions/platform-api/index.ts ]; then
            deno check --node-modules-dir=auto supabase/functions/platform-api/index.ts
          fi
      - name: Partner Edge Function checks
        shell: bash
        run: |
          deno check --node-modules-dir=auto supabase/functions/platform-partner-admin/index.ts
          deno check supabase/functions/platform-developer-portal/index.ts
          deno check --node-modules-dir=auto supabase/functions/platform-integration-smoke/index.ts
          deno check supabase/functions/platform-distribution/index.ts
          deno check --node-modules-dir=auto supabase/functions/deliver-platform-webhooks/index.ts
      - name: Developer portal build
        run: npm run build --workspace @kleenest/developer-portal
      - name: MCP server typecheck
        shell: bash
        run: |
          if [ -f mcp/kleenest-mcp/package.json ]; then
            npm install --prefix mcp/kleenest-mcp --no-audit --no-fund --ignore-scripts
            npm run typecheck --prefix mcp/kleenest-mcp
          fi
