name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the locked dependency graph against npm bulk advisories
        run: node scripts/npm-security-advisory-audit.mjs low

  repository-secret-hygiene:
    name: Repository secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked native credentials and privileged secret patterns
        shell: bash
        run: |
          set -euo pipefail
          tracked_native="$(git ls-files | grep -Ei '(^|/)(google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p8|p12|mobileprovision)$' || true)"
          if [ -n "$tracked_native" ]; then
            echo 'Forbidden native credential/signing files are tracked:' >&2
            printf '%s\n' "$tracked_native" >&2
            exit 1
          fi
          git check-ignore -q apps/consumer-mobile/google-services.json
          git check-ignore -q apps/business-mobile/google-services.json
          git check-ignore -q apps/fleet-mobile/google-services.json
          git check-ignore -q apps/platform-mobile/google-services.json

          privileged="$(git grep -I -n -E -- '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----|(^|[^A-Za-z0-9_])(sk_live_|rk_live_|whsec_|sb_secret_|service_role[=:]|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})' -- ':!*.md' ':!docs/**' ':!scripts/**' ':!.github/workflows/security-gate.yml' || true)"
          if [ -n "$privileged" ]; then
            echo 'Potential privileged secret material is present in tracked source:' >&2
            printf '%s\n' "$privileged" >&2
            exit 1
          fi

  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
      - name: Diagnose changed-source SARIF findings
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, glob
          paths=glob.glob('results/*.sarif')
          print('SARIF_FILES',paths)
          changed=('guestMonetization.ts','GuestInstallUpsell.tsx','StorePurchaseControls.tsx','AdMobNativeSlot.tsx','AdMobNativeSlot.native.tsx','sponsorship.ts','membership.tsx','AdaptiveExploreScreen.tsx','guest-insights.tsx')
          for path in paths:
            data=json.load(open(path))
            for run in data.get('runs',[]):
              rules={rule.get('id'):rule for rule in run.get('tool',{}).get('driver',{}).get('rules',[])}
              for finding in run.get('results',[]):
                locations=finding.get('locations') or []
                for location in locations:
                  physical=location.get('physicalLocation',{})
                  uri=physical.get('artifactLocation',{}).get('uri','')
                  if not any(name in uri for name in changed): continue
                  rule=rules.get(finding.get('ruleId'),{})
                  severity=rule.get('properties',{}).get('security-severity','')
                  line=physical.get('region',{}).get('startLine')
                  print('SARIF_ALERT',finding.get('ruleId'),severity,uri,line,(finding.get('message',{}).get('text','') or '')[:250])
          PY
