name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report PR/main divergence
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin "$PR_HEAD_SHA"
          MAIN_SHA="$(git rev-parse origin/main)"
          if git merge-base --is-ancestor "$MAIN_SHA" "$PR_HEAD_SHA"; then
            echo "PR head contains current main: $MAIN_SHA"
          else
            echo "::notice title=PR branch behind main::main advanced after this branch was created. CI will validate the PR as-is; the completion guard will update the branch only if GitHub requires it for merge."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Enforce feature lifecycle PR metadata
        if: github.event_name == 'pull_request'
        run: node scripts/pr-feature-lifecycle-audit.mjs
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Public Kleenest contact routing
        run: node scripts/public-contact-links-audit.mjs
      - name: Overture ingestion self-test
        run: python3 scripts/overture-places-ingest.py --self-test
      - name: Resolve latest Consumer APK baseline
        id: consumer-apk-baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/resolve-consumer-apk-baseline.mjs --target-sha "$TARGET_SHA" --optional
      - name: Fetch Consumer APK baseline commit
        if: steps.consumer-apk-baseline.outputs.source_sha != ''
        run: git fetch --no-tags --depth=1 origin "${{ steps.consumer-apk-baseline.outputs.source_sha }}"
      - name: Consumer native drift visibility
        if: steps.consumer-apk-baseline.outputs.source_sha != ''
        run: node scripts/consumer-release-drift-audit.mjs --baseline "${{ steps.consumer-apk-baseline.outputs.source_sha }}" --report-only
      - name: Resolve synchronized family APK baseline
        id: family-apk-baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/resolve-family-apk-baseline.mjs --target-sha "$TARGET_SHA" --optional
      - name: Fetch family APK baseline commit
        if: steps.family-apk-baseline.outputs.source_sha != ''
        run: git fetch --no-tags --depth=1 origin "${{ steps.family-apk-baseline.outputs.source_sha }}"
      - name: App-family OTA/native drift visibility
        if: steps.family-apk-baseline.outputs.source_sha != ''
        run: node scripts/app-family-release-plan.mjs --baseline "${{ steps.family-apk-baseline.outputs.source_sha }}" --json-out "$RUNNER_TEMP/family-release-plan.json"
      - name: CI freshness policy
        run: node scripts/ci-freshness-policy-audit.mjs
