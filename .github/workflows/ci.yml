name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Trust quality convergence
        run: node scripts/trust-quality-convergence-audit.mjs
      - name: Reverification workflow convergence
        run: node scripts/reverification-workflow-convergence-audit.mjs
      - name: Trust mission compatibility
        run: node scripts/native-trust-mission-platform-audit.mjs
      - name: Production authority audits
        run: npm run audit
      - name: Native typecheck
        run: npm run native:typecheck
      - name: Production web build
        run: npm run build
