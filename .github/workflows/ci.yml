name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production environment contract
        run: node scripts/production-environment-contract-audit.mjs
      - name: Consumer product boundary
        run: node scripts/consumer-product-boundary-audit.mjs
      - name: Consumer activation loop
        run: node scripts/consumer-activation-loop-audit.mjs
      - name: Consumer bulk migration convergence
        run: node scripts/consumer-bulk-migration-convergence-audit.mjs
      - name: Consumer data production
        run: node scripts/consumer-data-production-audit.mjs
      - name: Consumer accessibility and native polish
        run: node scripts/native-consumer-accessibility-polish-audit.mjs
      - name: Consumer discovery continuity
        run: node scripts/native-consumer-continuity-audit.mjs
      - name: Consumer recovery convergence
        run: node scripts/native-consumer-recovery-audit.mjs
      - name: Consumer Google authentication
        run: node scripts/native-google-auth-audit.mjs
      - name: Consumer APK convergence
        run: node scripts/native-consumer-apk-convergence-audit.mjs
      - name: Native device readiness
        run: node scripts/native-device-readiness-audit.mjs
      - name: Trust quality convergence
        run: node scripts/trust-quality-convergence-audit.mjs
      - name: Reverification workflow convergence
        run: node scripts/reverification-workflow-convergence-audit.mjs
      - name: Reverification operations lifecycle
        run: node scripts/reverification-operations-lifecycle-audit.mjs
      - name: Trust mission compatibility
        run: node scripts/native-trust-mission-platform-audit.mjs
      - name: Core and commerce authority
        run: |
          node scripts/production-authority-audit.mjs
          node scripts/commerce-authority-audit.mjs
          node scripts/workspace-authority-audit.mjs
          node scripts/database-security-authority-audit.mjs
      - name: Native identity and notification authority
        run: |
          node scripts/native-authority-audit.mjs
          node scripts/native-push-authority-audit.mjs
          node scripts/native-push-context-authority-audit.mjs
          node scripts/native-community-authority-audit.mjs
          node scripts/native-activity-authority-audit.mjs
          node scripts/native-notification-preferences-authority-audit.mjs
          node scripts/native-notification-inbox-authority-audit.mjs
          node scripts/native-public-contributor-authority-audit.mjs
          node scripts/native-profile-mutation-authority-audit.mjs
      - name: Native evidence and trust authority
        run: |
          node scripts/native-amenity-inventory-audit.mjs
          node scripts/native-review-photo-authority-audit.mjs
          node scripts/native-review-photo-batch-authority-audit.mjs
          node scripts/native-evidence-presentation-audit.mjs
          node scripts/native-map-authority-audit.mjs
          node scripts/native-location-trust-summary-audit.mjs
          node scripts/native-contributor-relationship-audit.mjs
          node scripts/native-route-trust-presentation-audit.mjs
          node scripts/native-trust-decision-presentation-audit.mjs
          node scripts/native-trust-discovery-controls-audit.mjs
      - name: Native gameplay and platform authority
        run: |
          node scripts/native-game-authority-audit.mjs
          node scripts/native-account-control-audit.mjs
          node scripts/native-hotpath-rls-authority-audit.mjs
          node scripts/native-social-feed-authority-audit.mjs
          node scripts/native-location-contribution-authority-audit.mjs
          node scripts/native-internal-function-authority-audit.mjs
          node scripts/native-consumer-identity-rpc-authority-audit.mjs
          node scripts/native-social-progression-authority-audit.mjs
          node scripts/native-public-rpc-authority-audit.mjs
          node scripts/admin-control-plane-rpc-authority-audit.mjs
          node scripts/native-consumer-contribution-rpc-authority-audit.mjs
      - name: Business canonical authority
        run: node scripts/business-canonical-rpc-authority-audit.mjs
      - name: Fleet authority
        run: |
          node scripts/fleet-operational-rpc-authority-audit.mjs
          node scripts/fleet-intelligence-rpc-authority-audit.mjs
          node scripts/fleet-configuration-telemetry-rpc-authority-audit.mjs
      - name: Business analytics RPC authority
        run: |
          node scripts/business-analytics-core-rpc-authority-audit.mjs
          node scripts/business-legacy-analytics-authority-audit.mjs
      - name: Business analytics presentation
        run: node scripts/business-analytics-presentation-audit.mjs
      - name: Business operations presentation
        run: node scripts/business-operations-presentation-audit.mjs
      - name: Business advanced operations presentation
        run: node scripts/business-advanced-operations-presentation-audit.mjs
      - name: Business control plane completeness
        run: node scripts/business-control-plane-completeness-audit.mjs
      - name: Business operations inventory convergence
        run: node scripts/business-operations-inventory-convergence-audit.mjs
      - name: Restroom remediation convergence
        run: node scripts/business-restroom-remediation-convergence-audit.mjs
      - name: Remediation SLA recovery convergence
        run: node scripts/restroom-remediation-sla-recovery-convergence-audit.mjs
      - name: Remediation recovery history convergence
        run: node scripts/remediation-recovery-history-convergence-audit.mjs
      - name: Remediation confirmation reliability convergence
        run: node scripts/remediation-confirmation-reliability-convergence-audit.mjs
      - name: Remediation prevention confidence convergence
        run: node scripts/remediation-prevention-confidence-convergence-audit.mjs
      - name: Preventive work order convergence
        run: node scripts/restroom-preventive-work-order-convergence-audit.mjs
      - name: Preventive verification outcome convergence
        run: node scripts/preventive-verification-outcome-convergence-audit.mjs
      - name: Preventive effectiveness intelligence convergence
        run: node scripts/preventive-effectiveness-intelligence-convergence-audit.mjs
      - name: Preventive work lifecycle convergence
        run: node scripts/preventive-work-lifecycle-convergence-audit.mjs
      - name: GitHub Pages deployment convergence
        run: node scripts/pages-deployment-convergence-audit.mjs
      - name: Business health convergence
        run: node scripts/review-amenity-business-health-convergence-audit.mjs
      - name: Operator functional parity
        run: node scripts/operator-functional-parity-audit.mjs
      - name: Full authority chain parity
        run: npm run audit
      - name: Consumer native typecheck
        run: npm run native:typecheck
      - name: Business Fleet and Owner typecheck
        run: npm run operator:typecheck
      - name: Production web build
        run: npm run build
