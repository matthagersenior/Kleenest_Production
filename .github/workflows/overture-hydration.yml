name: Overture hydration
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overture-hydration-production
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.KLEENEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KLEENEST_SUPABASE_SERVICE_ROLE_KEY }}
      OVERTURE_BATCH_SIZE: '250'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify configured credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements-overture.txt
      - name: Run bounded Overture extraction
        run: python scripts/overture_hydration_worker.py
