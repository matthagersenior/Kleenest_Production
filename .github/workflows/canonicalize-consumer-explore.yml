name: Canonicalize Consumer Explore Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-consumer-explore-overlay-fix.mjs'
      - '.github/workflows/canonicalize-consumer-explore.yml'

permissions:
  contents: write

concurrency:
  group: canonicalize-consumer-explore
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical Explore behavior
        run: node scripts/apply-consumer-explore-overlay-fix.mjs
      - name: Verify canonical source contract
        run: |
          grep -q 'height: 190' apps/consumer-mobile/app/explore.tsx
          grep -q 'Close selected location' apps/consumer-mobile/app/explore.tsx
          grep -q 'hitSlop={14}' apps/consumer-mobile/app/explore.tsx
          ! grep -q '|| rows\[0\] || null' apps/consumer-mobile/app/explore.tsx
      - name: Commit canonical source when changed
        run: |
          if git diff --quiet -- apps/consumer-mobile/app/explore.tsx; then
            echo 'Explore source already canonical.'
            exit 0
          fi
          git config user.name 'kleenest-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/consumer-mobile/app/explore.tsx
          git commit -m 'Canonicalize Consumer Explore interactions'
          git pull --rebase origin main
          git push origin HEAD:main
