name: Native explore home

on:
  pull_request:
    paths:
      - 'apps/consumer-mobile/**'
      - 'scripts/native-explore-home-audit.mjs'
      - '.github/workflows/native-explore-home.yml'

jobs:
  explore-home-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/native-explore-home-audit.mjs
