name: Consumer Widget Dependency Lock Sync
on:
  push:
    branches:
      - feature/consumer-native-widgets-release-20261022
    paths:
      - 'apps/consumer-mobile/package.json'
      - '.github/workflows/consumer-widget-dependency-lock-sync.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/consumer-native-widgets-release-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate reproducible SDK 57 widget dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --workspace @kleenest/consumer-mobile
      - name: Commit generated lockfile to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock Expo SDK 57 consumer widget dependencies'
          git push origin HEAD:feature/consumer-native-widgets-release-20261022
