name: Repair Consumer Explore Progressive Disclosure
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-consumer-explore-progressive-disclosure.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Observe red Explore contract
        run: |
          if node scripts/consumer-adaptive-route-search-audit.mjs; then
            echo "Expected progressive-disclosure audit to fail before implementation"
            exit 1
          fi
      - name: Implement progressive disclosure
        run: python scripts/fix-consumer-explore-progressive-disclosure.py
      - name: Verify green Explore contract
        run: node scripts/consumer-adaptive-route-search-audit.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Consumer typecheck
        run: npm run native:typecheck
      - name: Commit repaired Explore implementation
        run: |
          git config user.name "kleenest-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/consumer-mobile/features/AdaptiveExploreScreen.tsx
          git diff --cached --check
          git commit -m "fix(consumer): restore progressive Explore controls"
          git push origin HEAD:main
