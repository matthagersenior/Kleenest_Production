name: Temporary patched Zod dependency lock refresh
on:
  push:
    branches: [feature/consumer-native-widgets-release-20261022]
    paths:
      - 'package.json'
      - '.github/workflows/temporary-zod-lock-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/consumer-native-widgets-release-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate pinned Zod dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const version=lock.packages['node_modules/zod']?.version;
          if(version!=='4.6.7')throw Error('Zod security upgrade not resolved in lockfile: '+version);
          console.log('Verified patched Zod',version);
          NODE
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Pin patched Zod 4.6.7 in dependency lock'
          git push origin HEAD:feature/consumer-native-widgets-release-20261022
