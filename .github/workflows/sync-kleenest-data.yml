name: Sync Kleenest Data Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-kleenest-data.yml'
      - 'supabase/migrations/*archive_sync*.sql'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: kleenest-data-archive-sync
  cancel-in-progress: true

env:
  PROD_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
  DATA_SUPABASE_URL: https://sxgymblzmwdqnaidbbuq.supabase.co

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required secrets
        env:
          PROD_KEY: ${{ secrets.KLEENEST_PROD_SERVICE_ROLE_KEY }}
          DATA_KEY: ${{ secrets.KLEENEST_DATA_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROD_KEY" || { echo "Missing KLEENEST_PROD_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$DATA_KEY" || { echo "Missing KLEENEST_DATA_SERVICE_ROLE_KEY"; exit 1; }

      - name: Incrementally archive hot provenance into verified Storage objects
        env:
          PROD_KEY: ${{ secrets.KLEENEST_PROD_SERVICE_ROLE_KEY }}
          DATA_KEY: ${{ secrets.KLEENEST_DATA_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # Resume from the most recent successful archive run, with a small idempotent overlap.
          # This preserves completeness across delayed/failed schedules without rescanning a fixed day.
          FALLBACK_SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          LAST_SUCCESS="$(
            curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$REPOSITORY/actions/workflows/sync-kleenest-data.yml/runs?status=success&per_page=1"               | jq -r '.workflow_runs[0].run_started_at // empty'
          )"
          if [ -n "$LAST_SUCCESS" ]; then
            SINCE="$(date -u -d "$LAST_SUCCESS - 15 minutes" +%Y-%m-%dT%H:%M:%SZ)"
          else
            SINCE="$FALLBACK_SINCE"
          fi
          echo "Archive resume watermark: $SINCE"
          BATCH=500

          # Fail open for the archive lane when Production cannot serve even a tiny read.
          # This prevents a background archival task from adding pressure to an unhealthy DB.
          if ! curl --fail --silent --show-error --get \
            --connect-timeout 5 --max-time 10 \
            "$PROD_SUPABASE_URL/rest/v1/external_data_sources" \
            -H "apikey: $PROD_KEY" \
            -H "Authorization: Bearer $PROD_KEY" \
            --data-urlencode 'select=id' \
            --data-urlencode 'limit=1' >/dev/null; then
            echo '{"ok":true,"status":"deferred_production_unhealthy"}'
            exit 0
          fi

          post_archive() {
            local kind="$1"
            local file="$2"
            local count
            count="$(jq 'length' "$file")"
            [ "$count" -eq 0 ] && return 0

            jq -n --arg kind "$kind" --slurpfile rows "$file"               '{kind:$kind,rows:$rows[0],source:"github_incremental_overlap"}' > payload.json
            curl --fail-with-body --silent --show-error               -X POST "$DATA_SUPABASE_URL/functions/v1/archive-object-ingest"               -H "apikey: $DATA_KEY"               -H "Authorization: Bearer $DATA_KEY"               -H 'Content-Type: application/json'               --data-binary @payload.json >/dev/null
          }

          fetch_static_sources() {
            local code
            code="$(
              curl --silent --show-error --get                 -o rows.json -w '%{http_code}'                 "$PROD_SUPABASE_URL/rest/v1/external_data_sources"                 -H "apikey: $PROD_KEY"                 -H "Authorization: Bearer $PROD_KEY"                 --data-urlencode 'select=*'                 --data-urlencode 'active=eq.true'                 --data-urlencode 'order=id.asc'                 --data-urlencode 'limit=500'
            )"
            [ "$code" = "200" ] || [ "$code" = "206" ] || { cat rows.json; exit 1; }
            post_archive external_data_sources rows.json
          }

          fetch_incremental() {
            local table="$1"
            local kind="$2"
            local time_col="$3"
            local cursor_ts=""
            local cursor_id=""

            while true; do
              local code
              if [ -z "$cursor_id" ]; then
                code="$(
                  curl --silent --show-error --get                     -o rows.json -w '%{http_code}'                     "$PROD_SUPABASE_URL/rest/v1/$table"                     -H "apikey: $PROD_KEY"                     -H "Authorization: Bearer $PROD_KEY"                     --data-urlencode 'select=*'                     --data-urlencode "$time_col=gte.$SINCE"                     --data-urlencode "order=$time_col.asc,id.asc"                     --data-urlencode "limit=$BATCH"
                )"
              else
                code="$(
                  curl --silent --show-error --get                     -o rows.json -w '%{http_code}'                     "$PROD_SUPABASE_URL/rest/v1/$table"                     -H "apikey: $PROD_KEY"                     -H "Authorization: Bearer $PROD_KEY"                     --data-urlencode 'select=*'                     --data-urlencode "or=($time_col.gt.$cursor_ts,and($time_col.eq.$cursor_ts,id.gt.$cursor_id))"                     --data-urlencode "order=$time_col.asc,id.asc"                     --data-urlencode "limit=$BATCH"
                )"
              fi
              [ "$code" = "200" ] || [ "$code" = "206" ] || { cat rows.json; exit 1; }

              local count
              count="$(jq 'length' rows.json)"
              [ "$count" -eq 0 ] && break
              post_archive "$kind" rows.json
              [ "$count" -lt "$BATCH" ] && break

              cursor_ts="$(jq -r --arg col "$time_col" '.[-1][$col] // empty' rows.json)"
              cursor_id="$(jq -r '.[-1].id // empty' rows.json)"
              [ -n "$cursor_ts" ] && [ -n "$cursor_id" ] || {
                echo "Unable to advance archive cursor for $table" >&2
                exit 1
              }
            done
          }

          fetch_static_sources
          fetch_incremental external_location_records external_location_records last_seen_at
          fetch_incremental external_observations external_observations imported_at
          fetch_incremental national_ingestion_runs national_ingestion_runs started_at

          rm -f rows.json payload.json

      - name: Verify object archive endpoint
        env:
          DATA_KEY: ${{ secrets.KLEENEST_DATA_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST "$DATA_SUPABASE_URL/functions/v1/archive-object-ingest"             -H "apikey: $DATA_KEY"             -H "Authorization: Bearer $DATA_KEY"             -H 'Content-Type: application/json'             --data '{"kind":"external_location_records","rows":[],"source":"github_health_check"}'             | jq -e '.ok == true and .skipped == true' >/dev/null
