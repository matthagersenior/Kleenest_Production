name: Overture Read-Only Extraction Preflight
on:
  push:
    branches: [fix/supabase-history-source-reconciliation-20261022]
    paths: ['.github/workflows/overture-readonly-extraction-preflight.yml']
permissions:
  contents: read
jobs:
  extract-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-overture.txt
      - name: Verify extraction contract
        run: python -m unittest scripts/test_overture_hydration_worker.py
      - name: Read-only public Overture query validation without claiming a task
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,importlib.util,sys
          import duckdb
          os.environ['SUPABASE_URL']='https://example.invalid'
          os.environ['SUPABASE_SERVICE_ROLE_KEY']='not-used'
          spec=importlib.util.spec_from_file_location('overture','scripts/overture_hydration_worker.py')
          worker=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)
          conn=duckdb.connect()
          conn.execute("INSTALL httpfs; LOAD httpfs")
          conn.execute("INSTALL spatial; LOAD spatial")
          conn.execute("SET s3_region='us-west-2'")
          conn.execute("SET s3_access_key_id=''")
          conn.execute("SET s3_secret_access_key=''")
          conn.execute("SET memory_limit='3GB'")
          # A single bounded sample of an existing active Overture queue tile.
          # No Kleenest DB connection, no writes, no leases, no canonical ingest.
          rows=worker.extract(conn,'2026-09-23.1',[-120.15,37.15,-118.95,38.35],'')
          for row in rows[:3]:
              assert len(row)==5
              assert isinstance(row[0],str) and row[0]
              assert isinstance(row[1],str) and row[1]
              assert -180<=float(row[3])<=180 and -90<=float(row[4])<=90
          print('Overture read-only extraction validated, returned',len(rows),'rows; no writes performed')
          PY
