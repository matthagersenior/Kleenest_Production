name: Build Consumer Android Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      EAS_PROJECT_ID: 22a65aa3-c615-4c4f-a34d-084babc28fd7
      KLEENEST_RELEASE_CHANNEL: candidate
    steps:
      - name: Resolve exact source SHA
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify exact consumer head and production contract
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.sha }}"
          node scripts/production-environment-contract-audit.mjs
          npm run native:typecheck
          node scripts/native-consumer-apk-convergence-audit.mjs
          node scripts/native-device-readiness-audit.mjs
          node scripts/native-consumer-recovery-audit.mjs
          node scripts/consumer-family-capability-audit.mjs
      - name: Report native production identity
        shell: bash
        run: |
          echo "### Release-candidate identity embedded" >> "$GITHUB_STEP_SUMMARY"
          echo "App version: 1.0.0" >> "$GITHUB_STEP_SUMMARY"
          echo "Release channel: $KLEENEST_RELEASE_CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Expo/EAS project: $EAS_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Supabase project: ssgesjzdvdsqacdtasje" >> "$GITHUB_STEP_SUMMARY"
          echo "Family capability: five-seat release gate passed" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate Android native project
        working-directory: apps/consumer-mobile
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build optimized installable release APK
        working-directory: apps/consumer-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Stage canonical APK
        run: |
          mkdir -p artifacts
          cp apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/kleenest-consumer-1.0.0-${{ steps.source.outputs.sha }}.apk"
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kleenest-consumer-android-candidate-${{ steps.source.outputs.sha }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
