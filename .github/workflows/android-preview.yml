name: Build Consumer Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/consumer-mobile/**'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: consumer-standalone-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      EAS_PROJECT_ID: 22a65aa3-c615-4c4f-a34d-084babc28fd7
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify consumer production contract
        run: |
          node scripts/production-environment-contract-audit.mjs
          npm run native:typecheck
          node scripts/native-consumer-apk-convergence-audit.mjs
          node scripts/native-device-readiness-audit.mjs
          node scripts/native-consumer-recovery-audit.mjs
          node scripts/consumer-family-capability-audit.mjs
      - name: Generate clean Android native project
        working-directory: apps/consumer-mobile
        run: npx expo prebuild --platform android --clean
      - name: Build standalone release APK with embedded JS bundle
        working-directory: apps/consumer-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release artifact
        run: |
          test -f apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -p apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/consumer.bundle
          test -s /tmp/consumer.bundle
          grep -a -q 'ssgesjzdvdsqacdtasje.supabase.co' /tmp/consumer.bundle
          ! grep -a -q 'Development Build' /tmp/consumer.bundle
          mkdir -p artifacts
          cp apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/Kleenest-Consumer-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Standalone-APK
          path: artifacts/Kleenest-Consumer-Standalone.apk
          if-no-files-found: error
          retention-days: 30
