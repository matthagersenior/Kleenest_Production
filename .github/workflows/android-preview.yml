name: Build Consumer Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify production contract
        run: |
          npm run -s audit:production
          test -f app/explore.tsx
          grep -q 'MapLegend' app/explore.tsx
          grep -q 'PlaceIcon item={item}' app/explore.tsx
          grep -q 'Your current location' app/explore.tsx
          grep -q 'Full details' app/explore.tsx
          grep -q 'Scroll results · map stays fixed' app/explore.tsx
          grep -q 'height: 230' app/explore.tsx
          grep -q 'Close selected location' app/explore.tsx
          grep -q 'hitSlop={14}' app/explore.tsx
          grep -q 'business_logo_url' app/explore.tsx

      - name: Remove development-only Expo runtime
        run: |
          npm uninstall expo-dev-client --save || true

      - name: Clean native prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Apply Consumer launcher artwork
        run: |
          if [ -f scripts/apply-native-launcher-icon.mjs ]; then
            node scripts/apply-native-launcher-icon.mjs
          fi

      - name: Build universal release APK
        working-directory: android
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*androidTest*' ! -name '*test*' | sort | head -n1)"
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo 'No release APK found.' >&2
            find android/app/build/outputs -type f -maxdepth 8 -print || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Resolved release APK: $APK"
          ls -lh "$APK"

      - name: Verify release APK architecture, engine, and bundle
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ steps.apk.outputs.path }}'
          APK_LISTING="$RUNNER_TEMP/consumer-apk-listing.txt"
          BUNDLE_FILE="$RUNNER_TEMP/index.android.bundle"

          # Avoid unzip|grep -q pipelines under pipefail. grep can close the pipe
          # after a match and make unzip exit 141, falsely failing a valid APK.
          unzip -Z1 "$APK" > "$APK_LISTING"
          grep -Fxq 'lib/arm64-v8a/libreactnative.so' "$APK_LISTING" || { echo 'Release APK is missing ARM64 React Native runtime.' >&2; exit 1; }
          grep -Fxq 'lib/arm64-v8a/libhermes.so' "$APK_LISTING" || { echo 'Release APK is missing ARM64 Hermes runtime.' >&2; exit 1; }
          grep -Fxq 'assets/index.android.bundle' "$APK_LISTING" || { echo 'Release APK is missing embedded production JS bundle.' >&2; exit 1; }

          unzip -p "$APK" assets/index.android.bundle > "$BUNDLE_FILE"
          if grep -aFq 'http://localhost:8081' "$BUNDLE_FILE"; then
            echo 'Release JS bundle still references localhost Metro.' >&2
            exit 1
          fi
          if grep -aFq 'http://127.0.0.1:8081' "$BUNDLE_FILE"; then
            echo 'Release JS bundle still references loopback Metro.' >&2
            exit 1
          fi
          if grep -aFq 'Bundle URL' "$BUNDLE_FILE"; then
            echo 'Release JS bundle contains a development bundle URL marker.' >&2
            exit 1
          fi
          echo 'Release APK architecture, Hermes runtime, and embedded bundle verified.'

      - name: Prepare x86 emulator startup diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'x86_64' android/gradle.properties 2>/dev/null; then
            echo 'x86_64 already configured.'
          else
            printf '\nreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64\n' >> android/gradle.properties
          fi
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Android startup + Explore smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-startup-smoke.sh

      - name: Stage standalone APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp '${{ steps.apk.outputs.path }}' dist/Kleenest-Consumer.apk
          sha256sum dist/Kleenest-Consumer.apk | tee dist/Kleenest-Consumer.apk.sha256
          ls -lh dist/Kleenest-Consumer.apk

      - name: Upload Consumer standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Standalone-APK
          path: |
            dist/Kleenest-Consumer.apk
            dist/Kleenest-Consumer.apk.sha256
          retention-days: 30
          if-no-files-found: error
