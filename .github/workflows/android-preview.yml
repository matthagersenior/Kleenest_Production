name: Build Consumer Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/consumer-mobile/**'
      - 'packages/mobile-core/**'
      - 'scripts/**'
      - 'config/production-environment.json'
      - 'package.json'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      KLEENEST_STANDALONE_ANDROID: 1
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Verify current Consumer source contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-environment-contract-audit.mjs
          node scripts/native-device-readiness-audit.mjs
          node scripts/native-consumer-apk-convergence-audit.mjs
          node scripts/native-consumer-presentation-convergence-audit.mjs
          npm run native:typecheck
          test -f apps/consumer-mobile/app/explore.tsx
          grep -q 'MapLegend' apps/consumer-mobile/app/explore.tsx
          grep -q 'PlaceIcon item={item}' apps/consumer-mobile/app/explore.tsx
          grep -q 'Your current location' apps/consumer-mobile/app/explore.tsx
          grep -q 'Full details' apps/consumer-mobile/app/explore.tsx
          grep -q 'Scroll results · map stays fixed' apps/consumer-mobile/app/explore.tsx
          grep -q 'height: 230' apps/consumer-mobile/app/explore.tsx
          grep -q 'Close selected location' apps/consumer-mobile/app/explore.tsx
          grep -q 'hitSlop={14}' apps/consumer-mobile/app/explore.tsx
          grep -q 'business_logo_url' apps/consumer-mobile/app/explore.tsx
          grep -q "icon: './assets/app-icon.png'" apps/consumer-mobile/app.config.ts
          grep -q "package: 'com.kleenest.app'" apps/consumer-mobile/app.config.ts

      - name: Remove development-only Expo runtime from build tree
        run: npm uninstall expo-dev-client --workspace @kleenest/consumer-mobile --no-save || true

      - name: Generate clean Consumer Android project
        working-directory: apps/consumer-mobile
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Apply supplied Kleenest Consumer launcher artwork
        run: node scripts/apply-consumer-native-launcher-icon.mjs

      - name: Build universal release APK
        working-directory: apps/consumer-mobile/android
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/consumer-mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*androidTest*' ! -name '*test*' | sort | head -n1)"
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo 'No Consumer release APK found.' >&2
            find apps/consumer-mobile/android/app/build/outputs -maxdepth 8 -type f -print || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Resolved Consumer release APK: $APK"
          ls -lh "$APK"

      - name: Verify release APK architecture, engine, bundle, and launcher resources
        shell: bash
        run: |
          set -euo pipefail
          APK='${{ steps.apk.outputs.path }}'
          APK_LISTING="$RUNNER_TEMP/consumer-apk-listing.txt"
          BUNDLE_FILE="$RUNNER_TEMP/index.android.bundle"
          unzip -Z1 "$APK" > "$APK_LISTING"
          grep -Fxq 'lib/arm64-v8a/libreactnative.so' "$APK_LISTING" || { echo 'Release APK is missing ARM64 React Native runtime.' >&2; exit 1; }
          grep -Fxq 'lib/arm64-v8a/libhermes.so' "$APK_LISTING" || { echo 'Release APK is missing ARM64 Hermes runtime.' >&2; exit 1; }
          grep -Fxq 'assets/index.android.bundle' "$APK_LISTING" || { echo 'Release APK is missing embedded production JS bundle.' >&2; exit 1; }
          grep -Eq '^res/(mipmap|drawable).*(ic_launcher|app_icon)' "$APK_LISTING" || { echo 'Release APK is missing packaged launcher resources.' >&2; exit 1; }
          unzip -p "$APK" assets/index.android.bundle > "$BUNDLE_FILE"
          if grep -aFq 'http://localhost:8081' "$BUNDLE_FILE" || grep -aFq 'http://127.0.0.1:8081' "$BUNDLE_FILE"; then
            echo 'Release JS bundle still references Metro.' >&2
            exit 1
          fi
          echo 'Consumer release payload verified.'

      - name: Enable x86_64 startup diagnostic architecture
        shell: bash
        run: |
          set -euo pipefail
          PROPS=apps/consumer-mobile/android/gradle.properties
          if grep -q '^reactNativeArchitectures=' "$PROPS"; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64/' "$PROPS"
          else
            printf '\nreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64\n' >> "$PROPS"
          fi
          cd apps/consumer-mobile/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Android 16 startup + Explore smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-startup-smoke.sh '${{ steps.apk.outputs.path }}' com.kleenest.app Consumer 'kleenest://explore' android-startup-logs

      - name: Stage standalone Consumer APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp '${{ steps.apk.outputs.path }}' dist/Kleenest-Consumer.apk
          sha256sum dist/Kleenest-Consumer.apk | tee dist/Kleenest-Consumer.apk.sha256
          ls -lh dist/Kleenest-Consumer.apk

      - name: Upload Consumer standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Standalone-APK
          path: |
            dist/Kleenest-Consumer.apk
            dist/Kleenest-Consumer.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload Consumer startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Startup-Diagnostics
          path: android-startup-logs
          if-no-files-found: ignore
          retention-days: 7
