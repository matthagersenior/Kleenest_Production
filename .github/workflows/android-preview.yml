name: Build Consumer Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/consumer-mobile/**'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: consumer-standalone-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
      EAS_PROJECT_ID: 22a65aa3-c615-4c4f-a34d-084babc28fd7
      KLEENEST_STANDALONE_ANDROID: '1'
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify consumer production contract
        run: |
          node scripts/production-environment-contract-audit.mjs
          npm run native:typecheck
          node scripts/native-consumer-apk-convergence-audit.mjs
          node scripts/native-device-readiness-audit.mjs
          node scripts/native-consumer-recovery-audit.mjs
          node scripts/consumer-family-capability-audit.mjs
      - name: Precompile rich Explore contract
        run: |
          grep -q 'MapLegend' apps/consumer-mobile/app/explore.tsx
          grep -q 'PlaceIcon item={item}' apps/consumer-mobile/app/explore.tsx
          grep -q 'Your current location' apps/consumer-mobile/app/explore.tsx
          grep -q 'Full details' apps/consumer-mobile/app/explore.tsx
          grep -q 'Scroll results · map stays fixed' apps/consumer-mobile/app/explore.tsx
          grep -q 'height: 300' apps/consumer-mobile/app/explore.tsx
          grep -q 'business_logo_url' apps/consumer-mobile/components/RestroomSignals.tsx
          grep -q "shopping:{icon:'🛍'" apps/consumer-mobile/components/RestroomSignals.tsx
          grep -q "restaurant:{icon:'🍴'" apps/consumer-mobile/components/RestroomSignals.tsx
          grep -q "park:{icon:'🌳'" apps/consumer-mobile/components/RestroomSignals.tsx
          rm -rf apps/consumer-mobile/.preflight
          cd apps/consumer-mobile
          npx expo export --platform android --output-dir .preflight --clear
          test -n "$(find .preflight -type f -print -quit)"
      - name: Remove Expo development runtime from standalone dependency graph
        run: |
          rm -rf \
            node_modules/expo-dev-client \
            node_modules/expo-dev-launcher \
            node_modules/expo-dev-menu \
            node_modules/expo-dev-menu-interface \
            apps/consumer-mobile/node_modules/expo-dev-client \
            apps/consumer-mobile/node_modules/expo-dev-launcher \
            apps/consumer-mobile/node_modules/expo-dev-menu \
            apps/consumer-mobile/node_modules/expo-dev-menu-interface
          node - <<'NODE'
          const path = require('node:path');
          const roots = [path.resolve('apps/consumer-mobile')];
          for (const name of ['expo-dev-client','expo-dev-launcher','expo-dev-menu','expo-dev-menu-interface']) {
            try {
              require.resolve(`${name}/package.json`, { paths: roots });
              throw new Error(`${name} is still resolvable from the Consumer workspace`);
            } catch (error) {
              if (error && error.code === 'MODULE_NOT_FOUND') continue;
              throw error;
            }
          }
          NODE
      - name: Generate clean Android native project
        working-directory: apps/consumer-mobile
        run: npx expo prebuild --platform android --clean
      - name: Verify standalone release dependency graph
        working-directory: apps/consumer-mobile/android
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/consumer-release-deps.txt
          if grep -Eqi 'expo-dev-client|expo-dev-launcher|expo-dev-menu' /tmp/consumer-release-deps.txt; then
            echo 'Expo development runtime leaked into Consumer release dependencies.' >&2
            grep -Ei 'expo-dev-client|expo-dev-launcher|expo-dev-menu' /tmp/consumer-release-deps.txt >&2 || true
            exit 1
          fi
      - name: Build standalone release APK with embedded JS bundle
        working-directory: apps/consumer-mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release artifact
        run: |
          test -f apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk
          unzip -p apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle > /tmp/consumer.bundle
          test -s /tmp/consumer.bundle
          grep -a -q 'ssgesjzdvdsqacdtasje.supabase.co' /tmp/consumer.bundle
          grep -a -q 'EMAIL SIGN-IN CODE' /tmp/consumer.bundle
          grep -a -q '6-digit code' /tmp/consumer.bundle
          grep -a -q 'characters entered' /tmp/consumer.bundle
          grep -a -q 'MAP LEGEND' /tmp/consumer.bundle
          grep -a -q 'Business' /tmp/consumer.bundle
          grep -a -q 'Full details' /tmp/consumer.bundle
          grep -a -q 'Your current location' /tmp/consumer.bundle
          grep -a -q 'Scroll results' /tmp/consumer.bundle
          grep -a -q 'androidView' apps/consumer-mobile/app/explore.tsx
          ! grep -a -q 'Development Build' /tmp/consumer.bundle
          ! grep -a -q 'expo-dev-launcher' /tmp/consumer.bundle
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
      - name: Android 16 Consumer startup and discovery test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb wait-for-device
            adb install -r apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.kleenest.app android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.kleenest.app android.permission.ACCESS_FINE_LOCATION
            adb emu geo fix -89.703 38.123
            adb logcat -c
            adb shell am force-stop com.kleenest.app
            adb shell monkey -p com.kleenest.app -c android.intent.category.LAUNCHER 1
            sleep 20
            test -n "$(adb shell pidof com.kleenest.app | tr -d '\r' || true)" || (echo 'Consumer APK exited during startup.' >&2; adb logcat -d -v threadtime | tail -n 1000 >&2; exit 1)
            adb shell am start -W -a android.intent.action.VIEW -d 'kleenest://explore' com.kleenest.app
            sleep 30
            test -n "$(adb shell pidof com.kleenest.app | tr -d '\r' || true)" || (echo 'Consumer APK exited on Explore.' >&2; adb logcat -d -v threadtime | tail -n 1200 >&2; exit 1)
            adb shell dumpsys activity activities | grep -F com.kleenest.app >/dev/null
            ! adb logcat -d -v threadtime | grep -E 'Process: com\.kleenest\.app|FATAL EXCEPTION.*com\.kleenest\.app|UnsatisfiedLinkError.*com\.kleenest\.app'
      - name: Stage standalone APK
        run: |
          mkdir -p artifacts
          cp apps/consumer-mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/Kleenest-Consumer-Standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kleenest-Consumer-Standalone-APK
          path: artifacts/Kleenest-Consumer-Standalone.apk
          if-no-files-found: error
          retention-days: 30
