<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kleenest</title>
    <script>
      (function () {
        var base = '/Kleenest_Production';
        var route = window.location.pathname.slice(base.length) + window.location.search + window.location.hash;
        try { window.sessionStorage.setItem('kleenest:pages-route', route || '/'); } catch (_) {}
        window.location.replace(base + '/');
      })();
    </script>
  </head>
  <body></body>
</html>
